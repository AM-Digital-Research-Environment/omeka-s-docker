# HTTP-level settings loaded before server blocks
# Mounted as /etc/nginx/conf.d/00-http-settings.conf

# Hide nginx version in error pages and Server header
server_tokens off;

# Trust one operator-selected proxy address/network, not every private LAN.
# The default supports Docker bridges behind the loopback-only published port.
# Narrow this to your proxy/gateway IP. For direct HTTP without a proxy, use
# 192.0.2.1/32 (a documentation-only address that no real peer should use).
set_real_ip_from ${NGINX_TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $trusted_proxy {
    default 0;
    ${NGINX_TRUSTED_PROXY_CIDR} 1;
}

# Rate limiting zones
# Only login brute-force protection is enabled. General and API rate limits are
# a deliberate omission — not a technical limit: set_real_ip_from above rewrites
# the connection's client address, and $binary_remote_addr is taken from that
# same address, so these zones do key on the real visitor rather than on the
# Docker gateway. (That holds only while NGINX_TRUSTED_PROXY_CIDR actually
# matches the peer; with no proxy in front, point it at 192.0.2.1/32 so no
# client-supplied header is believed, and every request keys on its true peer.)
# Add further zones per endpoint if a workload needs them.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Return 429 Too Many Requests instead of default 503
limit_req_status 429;

# Honor X-Forwarded-Proto from the upstream reverse proxy so Omeka S generates
# correct https:// URLs in links, redirects, IIIF manifests, and emails.
# Falls back to the connection's own scheme when no header is present.
map "$trusted_proxy:$http_x_forwarded_proto" $fcgi_https {
    default   $https;
    "1:https" on;
}
