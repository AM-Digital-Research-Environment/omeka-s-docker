# HTTP-level settings loaded before server blocks
# Mounted as /etc/nginx/conf.d/00-http-settings.conf

# Hide nginx version in error pages and Server header
server_tokens off;

# Trust one operator-selected proxy address/network, not every private LAN.
# The default supports Docker bridges behind the loopback-only published port.
# Narrow this to your proxy/gateway IP. For direct HTTP without a proxy, use
# 192.0.2.1/32 (a documentation-only address that no real peer should use).
set_real_ip_from ${NGINX_TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $trusted_proxy {
    default 0;
    ${NGINX_TRUSTED_PROXY_CIDR} 1;
}

# Rate limiting zones
# Only login brute-force protection is enabled. General and API rate limits are
# a deliberate omission — not a technical limit: set_real_ip_from above rewrites
# the connection's client address, and $binary_remote_addr is taken from that
# same address, so these zones do key on the real visitor rather than on the
# Docker gateway. (That holds only while NGINX_TRUSTED_PROXY_CIDR actually
# matches the peer; with no proxy in front, point it at 192.0.2.1/32 so no
# client-supplied header is believed, and every request keys on its true peer.)
# Add further zones per endpoint if a workload needs them.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Return 429 Too Many Requests instead of default 503
limit_req_status 429;

# Honor X-Forwarded-Proto from the upstream reverse proxy so Omeka S generates
# correct https:// URLs in links, redirects, IIIF manifests, and emails.
# Falls back to the connection's own scheme when no header is present.
map "$trusted_proxy:$http_x_forwarded_proto" $fcgi_https {
    default   $https;
    "1:https" on;
}

# Access log without Omeka API keys. Omeka reads API keys only from the query
# string (?key_identity=…&key_credential=…), so the image's default "main"
# format writes every keyed request's credentials into `docker compose logs
# web`. The "redacted" format below is "main" field for field, except that the
# request line and the referer pass through the maps first; nginx.conf selects
# it for the server, so any log tooling reading the old format keeps working.
#
# A parameter counts as a key when its name contains "identity" or
# "credential" in any case, which also covers the spellings PHP folds into
# key_identity (key%5Fidentity, key.identity, key+identity). Names whose letters
# are themselves percent-encoded are not decoded. The value up to the next "&"
# becomes [REDACTED]; every other parameter is kept. An empty value carries
# nothing and is left alone.
#
# Two passes redact the last key parameter each, which covers the usual pair.
# A request still carrying an unredacted key after that (a key repeated three
# times, say) loses its whole query string instead, so no number of keys gets
# through. A referer that carries a key keeps only its path.
#
# The maps are evaluated only when a line is logged.
# .github/scripts/check-nginx.sh tests them against real requests.
map $request $omeka_log_request_1 {
    "~*^(.*[?&][^&=\s]*(?:identity|credential)[^&=\s]*=)(?!\[REDACTED\])[^&\s]+(.*)$" "$1[REDACTED]$2";
    default $request;
}
map $omeka_log_request_1 $omeka_log_request_2 {
    "~*^(.*[?&][^&=\s]*(?:identity|credential)[^&=\s]*=)(?!\[REDACTED\])[^&\s]+(.*)$" "$1[REDACTED]$2";
    default $omeka_log_request_1;
}
map $omeka_log_request_2 $omeka_log_request {
    "~*^(\S+\s+[^?\s]*)\?(?=(?:\S*&)?[^&=\s]*(?:identity|credential)[^&=\s]*=(?!\[REDACTED\])[^&\s])\S*(.*)$" "$1?[REDACTED]$2";
    default $omeka_log_request_2;
}
# No referer logs as "-", as it does in "main": a map always yields a value, so
# without the "" entry an absent header would log as "".
map $http_referer $omeka_log_referer {
    "~*^([^?]*)\?(?=(?:.*&)?[^&=\s]*(?:identity|credential)[^&=\s]*=[^&\s])" "$1?[REDACTED]";
    ""      "-";
    default $http_referer;
}

log_format redacted '$remote_addr - $remote_user [$time_local] "$omeka_log_request" '
                    '$status $body_bytes_sent "$omeka_log_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
