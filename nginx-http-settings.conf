# HTTP-level settings loaded before server blocks
# Mounted as /etc/nginx/conf.d/00-http-settings.conf

# Hide nginx version in error pages and Server header
server_tokens off;

# Trust one operator-selected proxy address/network, not every private LAN.
# The default supports Docker bridges behind the loopback-only published port.
# Narrow this to your proxy/gateway IP. For direct HTTP without a proxy, use
# 192.0.2.1/32 (a documentation-only address that no real peer should use).
set_real_ip_from ${NGINX_TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $trusted_proxy {
    default 0;
    ${NGINX_TRUSTED_PROXY_CIDR} 1;
}

# Rate limiting zones
# set_real_ip_from above rewrites the connection's client address, and
# $binary_remote_addr is taken from that same address, so these zones key on
# the real visitor rather than on the Docker gateway or the TLS proxy. (That
# holds only while NGINX_TRUSTED_PROXY_CIDR actually matches the peer; with no
# proxy in front, point it at 192.0.2.1/32 so no client-supplied header is
# believed, and every request keys on its true peer.)

# Login brute-force protection: always on.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Public REST API (/api and /api-local, see nginx.conf): opt-in with
# NGINX_API_RATE_LIMIT=on, NGINX_API_RATE requests per client (default 10r/s,
# nginx syntax: 10r/s, 300r/m). Off by default because legitimate API clients
# vary too much for one number to fit every site: harvesters, IIIF viewers and
# sites that pull from each other can all be bursty.
# Requests with an empty key are not counted, so when the switch is anything
# but "on" the map yields "" and the zone limits nothing; the location keeps a
# single shape either way instead of depending on an `if`.
#
# WARNING for deployments with in-stack API clients (compose.amira.yml's
# indexers and MCP servers call http://web/api from the Docker network at high
# volume): each such container is one client address here and would be
# throttled like any visitor. Before turning this on, check `docker compose
# logs web` for who calls /api and how often, and raise NGINX_API_RATE or keep
# it off if those callers would hit it.
map "${NGINX_API_RATE_LIMIT}" $api_limit_key {
    "~*^on$"    $binary_remote_addr;
    default     "";
}
limit_req_zone $api_limit_key zone=api:10m rate=${NGINX_API_RATE};

# Return 429 Too Many Requests instead of default 503
limit_req_status 429;

# Honor X-Forwarded-Proto from the upstream reverse proxy so Omeka S generates
# correct https:// URLs in links, redirects, IIIF manifests, and emails.
# Falls back to the connection's own scheme when no header is present.
map "$trusted_proxy:$http_x_forwarded_proto" $fcgi_https {
    default   $https;
    "1:https" on;
}

# Access log without Omeka API keys. Omeka reads API keys only from the query
# string (?key_identity=…&key_credential=…), so the image's default "main"
# format writes every keyed request's credentials into `docker compose logs
# web`. The "redacted" format below is "main" field for field, except that the
# request line and the referer pass through the maps first; nginx.conf selects
# it for the server, so any log tooling reading the old format keeps working.
#
# A parameter counts as a key when its name contains "identity" or
# "credential" in any case, which also covers the spellings PHP folds into
# key_identity (key%5Fidentity, key.identity, key+identity). Names whose letters
# are themselves percent-encoded are not decoded. The value up to the next "&"
# becomes [REDACTED]; every other parameter is kept. An empty value carries
# nothing and is left alone.
#
# Two passes redact the last key parameter each, which covers the usual pair.
# A request still carrying an unredacted key after that (a key repeated three
# times, say) loses its whole query string instead, so no number of keys gets
# through. A referer that carries a key keeps only its path.
#
# The maps are evaluated only when a line is logged.
# .github/scripts/check-nginx.sh tests them against real requests.
map $request $omeka_log_request_1 {
    "~*^(.*[?&][^&=\s]*(?:identity|credential)[^&=\s]*=)(?!\[REDACTED\])[^&\s]+(.*)$" "$1[REDACTED]$2";
    default $request;
}
map $omeka_log_request_1 $omeka_log_request_2 {
    "~*^(.*[?&][^&=\s]*(?:identity|credential)[^&=\s]*=)(?!\[REDACTED\])[^&\s]+(.*)$" "$1[REDACTED]$2";
    default $omeka_log_request_1;
}
map $omeka_log_request_2 $omeka_log_request {
    "~*^(\S+\s+[^?\s]*)\?(?=(?:\S*&)?[^&=\s]*(?:identity|credential)[^&=\s]*=(?!\[REDACTED\])[^&\s])\S*(.*)$" "$1?[REDACTED]$2";
    default $omeka_log_request_2;
}
# No referer logs as "-", as it does in "main": a map always yields a value, so
# without the "" entry an absent header would log as "".
map $http_referer $omeka_log_referer {
    "~*^([^?]*)\?(?=(?:.*&)?[^&=\s]*(?:identity|credential)[^&=\s]*=[^&\s])" "$1?[REDACTED]";
    ""      "-";
    default $http_referer;
}

log_format redacted '$remote_addr - $remote_user [$time_local] "$omeka_log_request" '
                    '$status $body_bytes_sent "$omeka_log_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

# --- Static asset caching ----------------------------------------------------
# Omeka's assetUrl helper appends ?v=<version> to the CSS/JS/images that core,
# modules and themes link to: the Omeka version for /application/asset/, the
# module's or theme's own version for theirs. A request carrying that argument
# may be cached without revalidating; one without it (assets linked by plain
# URL, ES-module chunks, fonts referenced from CSS) keeps the revalidate policy,
# so a changed file is picked up on the next view, ETag/Last-Modified answering
# 304 when it has not changed.
#
# How far ?v= can be trusted differs by tree:
# - /application/asset/ is part of a given Omeka release: a different file
#   means a different Omeka version and so a different URL. A year, immutable.
# - Modules and themes live on admin-writable volumes. A release bumps the
#   version, but a theme edited in place, a module re-deployed from a branch,
#   or one that forgets to bump its version keeps the same ?v= over changed
#   files. Seven days, without `immutable`, bounds how long a visitor can run
#   stale code in that case (a reload revalidates sooner) while still sparing
#   the per-view revalidation of every stylesheet and script.
# Everything else with a ?v= (assets outside those trees) gets the same week.
map $uri $static_versioned_cache_control {
    "~^/application/asset/" "public, max-age=31536000, immutable";
    default                 "public, max-age=604800";
}
map $arg_v $static_cache_control {
    ""      "public, max-age=0, must-revalidate";
    default $static_versioned_cache_control;
}

# Media under /files/ (nginx.conf, `location ~ ^/files/`). Allow-list of the
# directories Omeka itself writes, with file names it generates:
# - original/ and asset/ hold uploads under a random 40-hex storage ID that
#   core never rewrites: a replaced file gets a new ID, so a new URL. A year,
#   immutable.
# - large/, medium/ and square/ hold derivatives under the same ID. Core never
#   rewrites them either, but thumbnail-regeneration jobs (in modules) do, in
#   place, so they get the week the modules and themes get.
# Every other directory (module output such as linked-data dumps, caches,
# tiles) is rewritten in place under a fixed name and keeps revalidating.
map $uri $files_cache_control {
    "~^/files/(?:original|asset)/[^/]+$"        "public, max-age=31536000, immutable";
    "~^/files/(?:large|medium|square)/[^/]+$"   "public, max-age=604800";
    default                                     "public, max-age=0, must-revalidate";
}

# Uploads are served from this origin under their real MIME type, so an
# uploaded HTML, SVG or XML document opened directly runs its scripts with the
# site's origin: stored XSS against any admin who follows the link. Omeka's
# default upload whitelist has none of these types, but an admin can add them.
# For such responses under /files/ a second CSP header sandboxes the document
# (scripts, forms, plugins and same-origin access off) and blocks every fetch,
# leaving inline styles and data: images so an SVG or HTML page still renders.
#
# Keyed on the type actually sent rather than the extension, so every
# extension mime.types maps to an active type is covered: HTML, XHTML, SVG
# (including .svgz), MathML and any XML document (text/xml, application/xml,
# application/*+xml), since an XML document can carry XHTML-namespaced script.
# Not JavaScript or CSS: opened directly, they display as text, and the CSP of
# a script or stylesheet response does not apply where a page includes it.
# Not PDF either: Chrome's built-in viewer fails under a sandbox CSP. Nor
# images, audio or video: a CSP on an <img>/<video> response does not affect
# the page embedding it, but they gain nothing from one.
#
# The location sends this next to the frame-ancestors CSP of the security-
# headers snippet. Browsers enforce every CSP header they receive (the
# intersection); this one has no frame-ancestors directive, so the embedding
# rule stays exactly the FRAME_ANCESTORS one. add_header sends nothing for an
# empty value, so other types get no extra header.
map $sent_http_content_type $files_active_content_csp {
    "~*^(?:text/html|application/xhtml\+xml|image/svg\+xml|text/xml|text/mathml|application/xml|application/[^;]*\+xml)(?:;|$)" "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src data:";
    default "";
}

# --- HSTS (optional, off by default) ----------------------------------------
# For sites whose TLS-terminating proxy does not send Strict-Transport-Security
# itself. NGINX_HSTS_MAX_AGE is in seconds; 0 (the default) sends nothing. The
# header goes only on requests that arrived over HTTPS as far as nginx can tell
# ($fcgi_https above: the trusted proxy said so, or native TLS), never on plain
# HTTP, where browsers ignore it anyway and it would only confuse.
# No includeSubDomains or preload: this template cannot know what the
# operator's other subdomains serve, and both are hard to take back. Add them
# here deliberately if they fit.
map "$fcgi_https:${NGINX_HSTS_MAX_AGE}" $strict_transport_security {
    "~^on:0*$"          "";
    "~^on:([0-9]+)$"    "max-age=$1";
    default             "";
}
