# Read-only SPARQL endpoint over the DRE-LinkedData dump (the sparql service in
# compose.amira.yml, profile "sparql"). Mounted into
# /etc/nginx/templates/extra-locations/ and included from the server block in
# nginx.conf, like nginx-mcp-location.conf. The zones it uses are defined in
# nginx-sparql-limits.conf.
#
# The service has no network at all; nginx reaches it through a Unix socket on
# the sparql_socket volume. With the profile off the socket does not exist and
# /sparql answers 503, while the rest of the site is unaffected.
#
# Oxigraph answers the SPARQL 1.1 Protocol at its own /sparql path: GET with
# ?query=, POST as application/sparql-query or a form, and a service
# description for a GET without a query. Its other paths (/store, /update, the
# query UI) are not exposed, and the server refuses writes regardless.
location = /sparql {
    # CORS preflight. Not limit_except for the method check below: nginx
    # applies that while choosing the location, before any `if` runs, so it
    # would refuse the preflight too.
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    if ($request_method !~ ^(?:GET|POST)$) {
        add_header Allow "GET, POST, OPTIONS" always;
        return 405;
    }

    # Visitor and endpoint limits, so the endpoint cannot crowd out Omeka.
    # The container's own CPU and memory limits and its query watchdog bound
    # what the admitted queries can cost.
    limit_req zone=sparql burst=20 nodelay;
    limit_conn sparql_per_client 2;
    limit_conn sparql_total 4;
    limit_conn_status 429;

    # A query, not an upload.
    client_max_body_size 64k;

    proxy_pass http://unix:/srv/sparql/sparql.sock;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    # Oxigraph cancels a query after SPARQL_QUERY_TIMEOUT (30s); this leaves
    # it time to say so before nginx gives up on it.
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    # Never spool a large result to disk: /var/cache/nginx is a 64M tmpfs that
    # PHP responses buffer through too. Past the memory buffers nginx streams
    # the result at the pace the client reads it.
    proxy_max_temp_file_size 0;

    proxy_hide_header Access-Control-Allow-Origin;
    # add_header here replaces the server-level headers, so restate them.
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Vary "Accept" always;

    error_page 502 = @sparql_unavailable;
}

# The service is stopped, starting, or not enabled.
location @sparql_unavailable {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Retry-After 60 always;
    default_type text/plain;
    return 503 "The SPARQL endpoint is not available at the moment.\n";
}
