# Rate and concurrency limits for the SPARQL endpoint at /sparql (served by
# nginx-sparql-location.conf). Zones belong in the http context, so
# compose.amira.yml mounts this as /etc/nginx/templates/02-sparql.conf.template;
# the nginx image renders it to /etc/nginx/conf.d/, which nginx.conf includes
# at http level, before the server block that uses the zones.
#
# $binary_remote_addr is the real visitor, not the Docker gateway: see the
# set_real_ip_from note in nginx-http-settings.conf.

# Per visitor: one query a second on average, with room for a short burst.
limit_req_zone $binary_remote_addr zone=sparql:10m rate=60r/m;

# Queries one visitor may have in flight at once.
limit_conn_zone $binary_remote_addr zone=sparql_per_client:10m;

# Queries in flight across all visitors. Keyed on something every request
# shares, so it caps the endpoint as a whole however many addresses a client
# spreads its queries over.
limit_conn_zone $server_name zone=sparql_total:1m;
