# The dre: vocabulary, https://data.africamultiple.uni-bayreuth.de/ontology/dre#
# Static files generated by deploy/amira/vocabularies/build_dre_vocabulary.py,
# mounted read-only at /srv/dre-vocabulary by compose.amira.yml. Included from
# the server block in nginx.conf, like nginx-favicon-location.conf.
#
# /ontology/dre negotiates on Accept (map in nginx-dre-vocabulary-map.conf):
# HTML for browsers, Turtle, RDF/XML or JSON-LD for RDF clients. It answers
# 200 directly rather than redirecting: the terms are hash IRIs (…/dre#id), so
# the document itself is what they dereference to. /ontology/dre.ttl, .rdf,
# .jsonld and .html force one format.
location = /ontology/dre {
    rewrite ^ /ontology/dre.$dre_vocabulary_format last;
}

# The former namespace ended in a slash; send that spelling to the document.
location = /ontology/dre/ {
    return 301 /ontology/dre;
}

# None of the regex locations before the include (dot-files, source and
# config extensions, static assets) matches these four names.
location ~ ^/ontology/(dre\.(?:ttl|rdf|jsonld|html))$ {
    alias /srv/dre-vocabulary/$1;
    types {
        text/turtle         ttl;
        application/rdf+xml rdf;
        application/ld+json jsonld;
        text/html           html;
    }
    charset utf-8;
    charset_types text/turtle text/html;
    # add_header here replaces the server-level headers, so restate them.
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Vary $dre_vocabulary_vary always;
    add_header Content-Location $dre_vocabulary_content_location always;
    add_header Link '</ontology/dre.ttl>; rel="alternate"; type="text/turtle", </ontology/dre.rdf>; rel="alternate"; type="application/rdf+xml", </ontology/dre.jsonld>; rel="alternate"; type="application/ld+json", </ontology/dre.html>; rel="alternate"; type="text/html"' always;
    add_header Cache-Control "public, max-age=3600" always;
}
