# AMIRA MCP server (Streamable-HTTP/SSE). Mounted by compose.amira.yml into
# /etc/nginx/templates/extra-locations/, rendered by the nginx image's envsubst
# step into /etc/nginx/conf.d/extra-locations/mcp.conf, and included from the
# server block in nginx.conf. The $variables below are nginx runtime variables,
# untouched by envsubst thanks to NGINX_ENVSUBST_FILTER (see docker-compose.yml).
#
# `^~` makes this prefix win over `location /` and short-circuits the regex
# blocks, so the request never reaches Omeka's index.php router (no URL
# appropriation / 404 / redirect).
#
# The upstream is resolved at request time (not at config load) via Docker's
# embedded DNS, by putting the hostname in a variable. This way a missing or
# stopped amira-mcp container returns 502 for /mcp only, instead of making
# nginx fail to boot and taking the whole site down. `valid=10s` re-resolves
# so /mcp recovers on its own once amira-mcp comes back.
location ^~ /mcp {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $amira_mcp amira-mcp;
    proxy_pass http://$amira_mcp:8787$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # OVERWRITE, never append ($proxy_add_x_forwarded_for). amira-mcp runs with
    # AMIRA_TRUST_PROXY=true (compose.amira.yml) so its per-minute rate limit is
    # keyed per visitor instead of being one shared bucket for everyone behind
    # this proxy. That makes the header security-relevant: it becomes the
    # rate-limit key, so any entry a caller can write is an entry a caller can
    # use to mint themselves a fresh budget every request.
    #
    # Sending exactly ONE entry — the address this nginx resolved itself via
    # set_real_ip_from/real_ip_recursive (nginx-http-settings.conf), i.e. the
    # real client — removes that whole question, and does so independently of
    # which end of the chain the server counts from. That matters: v1.17.0 read
    # the leftmost entry, v1.19.0 reads the AMIRA_PROXY_HOPS'th from the right
    # (default 1). A single-entry header is the same address either way, so this
    # rule survives upstream changing its mind. Appending would not have.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";   # keepalive / SSE
    proxy_buffering off;                      # critical for SSE streaming
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
