# Content negotiation for the dre: vocabulary at /ontology/dre (served by
# nginx-dre-vocabulary-location.conf). A map belongs in the http context, so
# compose.amira.yml mounts this as /etc/nginx/templates/01-dre-vocabulary.conf.template;
# the nginx image renders it to /etc/nginx/conf.d/, which nginx.conf includes
# at http level. The 01- prefix loads it before the server block that uses it.
#
# nginx cannot weigh q-values, so this follows the rule of the W3C "Best
# Practice Recipes for Publishing RDF Vocabularies": a browser (any Accept naming
# HTML) gets the HTML page unless the client names an RDF type before HTML.
# Otherwise the RDF type named wins, Turtle first. No Accept header, or */*,
# gets Turtle, as DRE-LinkedData's /linked-data/void does.
map $http_accept $dre_vocabulary_format {
    default                                                       ttl;
    "~*text/turtle.*(text/html|application/xhtml\+xml)"           ttl;
    "~*application/rdf\+xml.*(text/html|application/xhtml\+xml)"  rdf;
    "~*application/ld\+json.*(text/html|application/xhtml\+xml)"  jsonld;
    "~*text/html|application/xhtml\+xml"                          html;
    "~*text/turtle"                                               ttl;
    "~*application/rdf\+xml"                                      rdf;
    "~*application/ld\+json"                                      jsonld;
}

# Only the negotiated address varies by Accept and names the document it
# returned; /ontology/dre.ttl and the like are fixed. add_header sends nothing
# for an empty value, so these headers are absent on the fixed addresses.
map $request_uri $dre_vocabulary_vary {
    "~^/ontology/dre(?:\?.*)?$"  Accept;
    default                      "";
}
map $request_uri $dre_vocabulary_content_location {
    "~^/ontology/dre(?:\?.*)?$"  /ontology/dre.$dre_vocabulary_format;
    default                      "";
}
