# AMIRA curator MCP endpoint (the amira-mcp-curator service in compose.amira.yml,
# profile "curator"). Mounted into /etc/nginx/templates/extra-locations/ and
# included from the server block in nginx.conf, like nginx-mcp-location.conf.
# The $variables below are nginx runtime variables, untouched by envsubst
# thanks to NGINX_ENVSUBST_FILTER (see docker-compose.yml).
#
# The curator server serves private records and private values to holders of a
# personal bearer token; it checks the token itself, so this location only has
# to deliver the request intact and keep the response out of every cache.
#
# Mounted whether or not the profile is on. The upstream is resolved at request
# time via Docker's embedded DNS (resolver plus a variable in proxy_pass, the
# technique /mcp and /index.php use), so with the service absent, stopped or
# still building, this location answers 502 and nothing else is affected:
# nginx still starts.
#
# Exact match: the curator server's only public path is its MCP endpoint. Its
# token-protected /metrics and its /healthz stay unreachable from outside.
location = /curator/mcp {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $amira_mcp_curator amira-mcp-curator;
    # The server answers MCP at /mcp. With a variable in proxy_pass nginx sends
    # exactly this URI, so the query string is restated.
    proxy_pass http://$amira_mcp_curator:8787/mcp$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # The personal token. nginx forwards client headers by default; stating it
    # keeps the dependency visible should anyone add
    # proxy_pass_request_headers off.
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header X-Real-IP         $remote_addr;
    # OVERWRITE, never append, for the reason given in nginx-mcp-location.conf:
    # amira-mcp-curator runs with AMIRA_TRUST_PROXY=true, so this header is its
    # per-client rate-limit key. The Compose contract check ties the two.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";   # keepalive / SSE
    proxy_buffering off;                      # critical for SSE streaming
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # The server refuses bodies over 64 KB itself; stop larger ones here.
    client_max_body_size 64k;

    # Private data: no cache on the way back may keep a copy, whatever the
    # upstream sends. add_header here replaces the server-level headers, so
    # restate them.
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
}

# Reserved for the OAuth step: Protected Resource Metadata (RFC 9728) for this
# endpoint, which the MCP authorization spec puts at
#   /.well-known/oauth-protected-resource/curator/mcp
# Not routed yet on purpose: the curator server does not serve this document
# until its OAuth resource-server support lands, and the upstream path is not
# settled. Until then the base nginx.conf's dot-path deny answers 403, so the
# path cannot be claimed by anything else. Pocket ID itself runs on its own
# subdomain, so its discovery documents never live on this host. When the
# server supports it, enable a block like this (exact match, so it wins over
# the dot-path regex, as nginx-well-known-void-location.conf does):
#
# location = /.well-known/oauth-protected-resource/curator/mcp {
#     resolver 127.0.0.11 valid=10s ipv6=off;
#     set $amira_mcp_curator amira-mcp-curator;
#     proxy_pass http://$amira_mcp_curator:8787/.well-known/oauth-protected-resource/mcp;
#     proxy_set_header Host $host;
#     proxy_set_header X-Forwarded-Proto $scheme;
# }
