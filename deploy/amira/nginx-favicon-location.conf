# /favicon.ico at the domain root. Browsers and crawlers request it no matter
# what <link rel="icon"> the page declares; without this block the static-file
# regex in nginx.conf falls through to Omeka's router, which answers 404.
# Mounted by compose.amira.yml into /etc/nginx/templates/extra-locations/ and
# included from the server block in nginx.conf, like nginx-mcp-location.conf.
#
# An exact-match location wins over every regex location. The PNG is served
# as is, under its real MIME type; every current browser accepts a PNG at
# /favicon.ico. The path follows the DRE-theme volume, so a theme release that
# changes the icon is picked up without touching this file.
location = /favicon.ico {
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    alias /var/www/html/themes/DRE-theme/asset/img/pwa/favicon-48.png;
    types { }
    default_type image/png;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    access_log off;
}
