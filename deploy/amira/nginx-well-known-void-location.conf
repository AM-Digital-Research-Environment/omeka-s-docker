# /.well-known/void, the VoID discovery location (RFC 8615) that DRE-LinkedData
# answers with a redirect to /linked-data/void. The base nginx.conf denies every
# dot-path (`location ~ /\.`), which would otherwise answer this with 403.
# Mounted by compose.amira.yml into /etc/nginx/templates/extra-locations/ and
# included from the server block in nginx.conf, like nginx-favicon-location.conf.
#
# An exact-match location wins over every regex location, so this opens this
# one path and nothing else: the rest of /.well-known/ and every other
# dot-file stay denied. Omeka's router sees the original REQUEST_URI.
location = /.well-known/void {
    rewrite ^ /index.php last;
}
