upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300

; Interim mitigation for CVE-2026-109619 (unauthenticated RCE via stale
; request-owned global state). The Dockerfile now pins PHP 8.5.12, which is the
; actual fix, but the pin alone patches nothing: the running container keeps
; serving the old image until scripts/rebuild-code.sh --pull has been built and
; deployed on the host. Drop these two lines once
;   docker compose exec php php -v
; reports 8.5.12 there - NOT when the pin changes, or the live deployment would
; be left both unpatched and unmitigated for that window. Neither feature is
; used by Omeka S, and this file is bind-mounted into conf.d, so the mitigation
; takes effect on a php restart without an image rebuild.
;
; The advisory's CVE-2026-109618 mitigations are deliberately NOT applied:
; memory_limit = -1 would let one request grow past the container's 1536M cap
; and take the whole php service down rather than failing that request, and
; post_max_size = 8M would break 100M media ingest. Only the upgrade fixes it.
;
; https://www.php.net/archive/2026.php#2026-10-21-1
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
