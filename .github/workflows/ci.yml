name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYSQL_DATABASE: ci_custom_database
      MYSQL_USER: ci_custom_user
      MYSQL_PASSWORD: ci-mysql-password-with-special-chars-#=
      TYPESENSE_API_KEY: ci-typesense-key
      SERVER_NAME: ci.example.org
    steps:
      # v7 resolved 2026-07-31. Keep the human-readable version in this comment
      # while pinning the action itself against tag retargeting.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Shell script syntax
        run: bash -n docker-entrypoint.sh scripts/*.sh deploy/amira/*.sh .github/scripts/*.sh

      - name: ShellCheck
        run: shellcheck --severity=warning docker-entrypoint.sh scripts/*.sh deploy/amira/*.sh .github/scripts/*.sh

      - name: PHP and JSON syntax
        run: |
          php -l _docker/vocabularies/import-vocabularies.php
          php -l _docker/local.config.php
          php -l .github/fixtures/ImmutableProbe/Module.php
          php -l .github/fixtures/ImmutableProbe/config/module.config.php
          for file in _docker/vocabularies/*.json deploy/amira/vocabularies/*.json; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Dockerfile build checks
        run: docker build --check .

      - name: Validate Compose security contract (base)
        run: docker compose --profile search config --format json | python3 .github/scripts/check-compose.py base

      - name: Validate Compose security contract (base + AMIRA overlay)
        run: docker compose --profile search -f docker-compose.yml -f compose.amira.yml config --format json | python3 .github/scripts/check-compose.py amira

      - name: Validate Compose security contract (base + immutable overlay)
        run: docker compose --profile search -f docker-compose.yml -f compose.immutable.yml config --format json | python3 .github/scripts/check-compose.py immutable

      # compose.immutable.yml replaces the php/web volume lists, so it must be
      # layered directly after the base stack. This asserts the supported
      # ordering keeps the AMIRA overlay's own mounts.
      - name: Validate Compose security contract (base + immutable + AMIRA)
        run: docker compose --profile search -f docker-compose.yml -f compose.immutable.yml -f compose.amira.yml config --format json | python3 .github/scripts/check-compose.py amira-immutable

      - name: Reject unsupported overlay ordering (immutable after AMIRA)
        run: |
          if docker compose --profile search -f docker-compose.yml -f compose.amira.yml -f compose.immutable.yml config --format json | python3 .github/scripts/check-compose.py amira-immutable; then
            echo "ERROR: layering compose.immutable.yml after an overlay silently drops that overlay's mounts, but the contract accepted it." >&2
            exit 1
          fi
          echo "Unsupported ordering correctly rejected."

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        variant: [base, amira, immutable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Base checks bootstrap plus the default admin-managed extensions:
      # EasyAdmin's writability condition, live module install via volume and
      # omeka-s-cli, persistence across recreation, and backup/restore.
      # AMIRA checks its baked modules/vocabulary, Typesense profile, and /mcp
      # wiring (as a 502 because the remote amira-mcp image is not built in CI).
      # Immutable checks the hardened overlay: nothing under the document root
      # writable, backup/restore, and an A/B image rebuild proving code changes
      # while database/media volumes remain intact.
      - name: Smoke test — ${{ matrix.variant }}
        run: bash .github/scripts/smoke.sh "${{ matrix.variant }}"
