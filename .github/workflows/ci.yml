name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MYSQL_DATABASE: ci_custom_database
      MYSQL_USER: ci_custom_user
      MYSQL_PASSWORD: ci-mysql-password-with-special-chars-#=
      TYPESENSE_API_KEY: ci-typesense-key
      SERVER_NAME: ci.example.org
    steps:
      # v7 resolved 2026-07-31. Keep the human-readable version in this comment
      # while pinning the action itself against tag retargeting.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Shell script syntax
        run: |
          for script in docker-entrypoint.sh _docker/typesense/entrypoint.sh scripts/*.sh deploy/amira/*.sh deploy/amira/sparql/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done

      - name: ShellCheck
        run: shellcheck --severity=warning docker-entrypoint.sh _docker/typesense/entrypoint.sh scripts/*.sh deploy/amira/*.sh deploy/amira/sparql/*.sh .github/scripts/*.sh

      - name: Operation failure paths (no containers)
        run: python3 .github/scripts/test-operations.py

      - name: PHP and JSON syntax
        run: |
          php -l _docker/vocabularies/import-vocabularies.php
          php -l _docker/local.config.php
          php -l .github/fixtures/ImmutableProbe/Module.php
          php -l .github/fixtures/ImmutableProbe/config/module.config.php
          for file in _docker/vocabularies/*.json deploy/amira/vocabularies/*.json; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Dockerfile build checks
        run: docker build --check .

      - name: Validate Compose security contract (base)
        run: docker compose --profile search config --format json | python3 .github/scripts/check-compose.py base

      # Without the curator profile the contract also asserts that the curator
      # service is absent: it serves private data and must never start by default.
      - name: Validate Compose security contract (base + AMIRA overlay)
        run: docker compose --profile search --profile sparql -f docker-compose.yml -f compose.amira.yml config --format json | python3 .github/scripts/check-compose.py amira

      - name: Validate Compose security contract (base + AMIRA overlay + curator profile)
        run: docker compose --profile search --profile sparql --profile curator -f docker-compose.yml -f compose.amira.yml config --format json | python3 .github/scripts/check-compose.py amira-curator

      - name: Validate Compose security contract (base + immutable overlay)
        run: docker compose --profile search -f docker-compose.yml -f compose.immutable.yml config --format json | python3 .github/scripts/check-compose.py immutable

      # compose.immutable.yml replaces the php/web volume lists, so it must be
      # layered directly after the base stack. This asserts the supported
      # ordering keeps the AMIRA overlay's own mounts.
      - name: Validate Compose security contract (base + immutable + AMIRA)
        run: docker compose --profile search --profile sparql -f docker-compose.yml -f compose.immutable.yml -f compose.amira.yml config --format json | python3 .github/scripts/check-compose.py amira-immutable

      - name: Reject unsupported overlay ordering (immutable after AMIRA)
        run: |
          if docker compose --profile search --profile sparql -f docker-compose.yml -f compose.amira.yml -f compose.immutable.yml config --format json | python3 .github/scripts/check-compose.py amira-immutable; then
            echo "ERROR: layering compose.immutable.yml after an overlay silently drops that overlay's mounts, but the contract accepted it." >&2
            exit 1
          fi
          echo "Unsupported ordering correctly rejected."

      # compose.secrets.yml: the same contracts with the four credentials read
      # from files. The plain variables are removed from the environment, as
      # an operator removes them from .env; SECRETS_DIR stands in for
      # MYSQL_PASSWORD (see docker-compose.yml). The files need not exist for
      # `config`. Supported order: base, [immutable], secrets, [deployment].
      - name: Validate Compose security contract (secrets overlay variants)
        run: |
          set -euo pipefail
          check() {
            local mode="$1"; shift
            env -u MYSQL_PASSWORD -u TYPESENSE_API_KEY SECRETS_DIR=./secrets \
              docker compose "$@" config --format json | python3 .github/scripts/check-compose.py "$mode"
          }
          check secrets --profile search -f docker-compose.yml -f compose.secrets.yml
          check immutable-secrets --profile search -f docker-compose.yml -f compose.immutable.yml -f compose.secrets.yml
          check amira-secrets --profile search --profile sparql -f docker-compose.yml -f compose.secrets.yml -f compose.amira.yml
          check amira-curator-secrets --profile search --profile sparql --profile curator -f docker-compose.yml -f compose.secrets.yml -f compose.amira.yml
          check amira-immutable-secrets --profile search --profile sparql -f docker-compose.yml -f compose.immutable.yml -f compose.secrets.yml -f compose.amira.yml

      # A credential left in .env next to its secret file would be dropped by
      # the overlay without a word; the contract (and the php entrypoint)
      # must refuse it instead.
      - name: Reject a plain credential left beside compose.secrets.yml
        run: |
          if SECRETS_DIR=./secrets docker compose --profile search -f docker-compose.yml -f compose.secrets.yml config --format json | python3 .github/scripts/check-compose.py secrets; then
            echo "ERROR: MYSQL_PASSWORD/TYPESENSE_API_KEY set beside compose.secrets.yml, but the contract accepted it." >&2
            exit 1
          fi
          echo "Leftover plain credentials correctly rejected."

      # compose.tls.yml: bundled Caddy in front of nginx. Listed last, after
      # the immutable and secrets overlays; not combined with compose.amira.yml
      # (a host-proxy deployment). SERVER_NAME comes from the job env.
      - name: Validate Compose security contract (TLS overlay variants)
        run: |
          set -euo pipefail
          docker compose --profile search -f docker-compose.yml -f compose.tls.yml config --format json \
            | python3 .github/scripts/check-compose.py tls
          docker compose --profile search -f docker-compose.yml -f compose.immutable.yml -f compose.tls.yml config --format json \
            | python3 .github/scripts/check-compose.py immutable-tls
          env -u MYSQL_PASSWORD -u TYPESENSE_API_KEY SECRETS_DIR=./secrets \
            docker compose --profile search -f docker-compose.yml -f compose.secrets.yml -f compose.tls.yml config --format json \
            | python3 .github/scripts/check-compose.py secrets-tls
          env -u MYSQL_PASSWORD -u TYPESENSE_API_KEY SECRETS_DIR=./secrets \
            docker compose --profile search -f docker-compose.yml -f compose.immutable.yml -f compose.secrets.yml -f compose.tls.yml config --format json \
            | python3 .github/scripts/check-compose.py immutable-secrets-tls

      # Caddy would ask the CA for a certificate for "" or for nginx's "_"
      # catch-all and keep failing: Compose must refuse an unset SERVER_NAME,
      # and the contract an explicit "_".
      - name: Reject compose.tls.yml without a real SERVER_NAME
        run: |
          if env -u SERVER_NAME docker compose -f docker-compose.yml -f compose.tls.yml config -q 2>/dev/null; then
            echo "ERROR: compose.tls.yml rendered without SERVER_NAME." >&2
            exit 1
          fi
          if SERVER_NAME=_ docker compose --profile search -f docker-compose.yml -f compose.tls.yml config --format json \
              | python3 .github/scripts/check-compose.py tls; then
            echo "ERROR: compose.tls.yml with SERVER_NAME=_ passed the contract." >&2
            exit 1
          fi
          echo "Missing or catch-all SERVER_NAME correctly rejected."

      # The base stack must still demand MYSQL_PASSWORD when neither it nor
      # SECRETS_DIR is set: plain `cp .env.example .env` users rely on it.
      - name: Base stack still requires MYSQL_PASSWORD
        run: |
          if env -u MYSQL_PASSWORD docker compose config -q 2>/dev/null; then
            echo "ERROR: docker compose config succeeded without MYSQL_PASSWORD." >&2
            exit 1
          fi
          echo "Missing MYSQL_PASSWORD correctly rejected."

      # Renders the nginx templates as Compose mounts them and runs nginx -t in
      # a throwaway container from the web target's nginx image, with every
      # upstream absent. Then checks with real requests that the access log
      # carries no Omeka API key and, for AMIRA, that /curator/mcp answers 502
      # without its service and proxies correctly to a stand-in.
      - name: nginx templates render and pass nginx -t (base)
        run: bash .github/scripts/check-nginx.sh base

      - name: nginx templates render and pass nginx -t (base + AMIRA overlay)
        run: bash .github/scripts/check-nginx.sh amira

      - name: No curator MCP secrets committed
        run: bash .github/scripts/check-committed-secrets.sh

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        variant: [base, amira, immutable, secrets, tls]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Base checks bootstrap plus the default admin-managed extensions:
      # EasyAdmin's writability condition, live module install via volume and
      # omeka-s-cli, persistence across recreation, and backup/restore.
      # AMIRA checks its baked modules/vocabulary, Typesense profile, and /mcp
      # wiring (as a 502 because the remote amira-mcp image is not built in CI).
      # Immutable checks the hardened overlay: nothing under the document root
      # writable, backup/restore, and an A/B image rebuild proving code changes
      # while database/media volumes remain intact.
      # Secrets runs the base stack plus compose.secrets.yml and the search
      # profile with every credential in a file: nothing in docker inspect,
      # db/php/typesense authenticate, backup/restore carry the files.
      # TLS runs base + compose.tls.yml with Caddy's internal CA on the
      # runner's free ports 80/443: redirect, HSTS, Secure cookie, https://
      # URLs from Omeka, and the certificates surviving backup/restore.
      - name: Smoke test — ${{ matrix.variant }}
        run: bash .github/scripts/smoke.sh "${{ matrix.variant }}"
