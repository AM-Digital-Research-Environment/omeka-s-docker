# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Monitor the Dockerfile's images: alpine (toolfetcher), php-fpm (runtime),
  # nginx (web target), plus the php-extension-installer and composer tool
  # stages. Those two are declared as named `FROM ... AS` stages specifically so
  # this ecosystem sees them — Dependabot reads `FROM` lines only, so an image
  # named inline in `COPY --from=` or `RUN --mount=from=` gets no updates. Keep
  # them as stages.
  #
  # Not covered anywhere, by design or by limitation:
  #   - the alpine HELPER_IMAGE pinned in scripts/backup.sh and
  #     scripts/restore.sh (plain shell, no ecosystem). CI asserts it matches
  #     the Dockerfile's alpine pin so the three cannot drift.
  #   - amira-mcp, pinned inside a build-context git URL; the weekly
  #     .github/workflows/amira-mcp-release.yml opens a tracking issue instead.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    # Stay on the nginx stable line. nginx ships two concurrent branches and
    # encodes them in the minor: even = stable (1.30, 1.32...), odd = mainline
    # (1.31, 1.33...). `1.31.3-alpine` IS the `mainline-alpine` tag, so any
    # minor bump silently switches release tracks. Blocking minor + major keeps
    # 1.30.x patches flowing and makes the (roughly annual) move to the next
    # stable line a deliberate change:
    #   docker pull nginx:stable-alpine && docker inspect \
    #     --format '{{index .RepoDigests 0}}' nginx:stable-alpine
    # Dependabot security updates are unaffected by version-update ignores.
    ignore:
      - dependency-name: "nginx"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Monitor the image tags pinned in docker-compose.yml: mysql and typesense.
  # (nginx is built from the Dockerfile's web target, so the ecosystem above
  # owns it.) This ecosystem only matches conventional Compose filenames, so
  # the compose.<name>.yml overlays are NOT scanned — neither pins an `image:`
  # today, and one added there would need its own tracking.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    # MySQL ships two concurrent lines: 9.x LTS (the `lts` tag) and the
    # calendar-versioned Innovation line (26.x = `innovation` = `latest`).
    # Dependabot only sees that 26 > 9, so a major bump jumps release tracks
    # rather than moving the version forward. This deployment follows LTS, so
    # block majors — 9.7.x patches and 9.x minors still flow, and adopting a
    # future LTS stays a deliberate change.
    ignore:
      - dependency-name: "mysql"
        update-types:
          - "version-update:semver-major"

  # Monitor the actions used by .github/workflows/. They are pinned to commit
  # SHAs with the human-readable version in a trailing comment; Dependabot
  # updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
