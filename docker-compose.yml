# Omeka S Docker Template
# A reusable Docker Compose configuration for Omeka S installations.
#
# This file is the generic base stack (web, php, db, optional typesense).
# Deployment-specific services and settings live in overlay files layered on
# top via COMPOSE_FILE in .env — see compose.amira.yml (the AMIRA production
# overlay) for a worked example.

services:
  web:
    # Build nginx from the same immutable Omeka code layer as PHP so module,
    # theme, and core assets can never drift between the two services.
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        OMEKA_VERSION: ${OMEKA_VERSION:-4.2.1}
        EXTRA_MODULES_FILE: ${EXTRA_MODULES_FILE:-_docker/empty-modules.txt}
        EXTRA_THEMES_FILE: ${EXTRA_THEMES_FILE:-_docker/empty-themes.txt}
        EXTRA_MODULES: ${EXTRA_MODULES:-}
        EXTRA_THEMES: ${EXTRA_THEMES:-}
        ENABLE_IIIF: ${ENABLE_IIIF:-false}
        OMEKA_ASSET_REFRESH: ${OMEKA_ASSET_REFRESH:-stable}
    ports:
      # NGINX_BIND controls the interface: the 127.0.0.1 default keeps nginx
      # reachable only through a reverse proxy on the host; set
      # NGINX_BIND=0.0.0.0 to serve HTTP directly (e.g. plain installs).
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-http-settings.conf:/etc/nginx/templates/00-http-settings.conf.template:ro
      # Rendered to /etc/nginx/conf.d/snippets/security-headers.conf so the
      # FRAME_ANCESTORS substitution applies to the snippet too.
      - ./nginx-security-headers.conf:/etc/nginx/templates/snippets/security-headers.conf.template:ro
      - omeka_media:/var/www/html/files:ro
      # Modules and themes are admin-managed at runtime (see the php service).
      # nginx serves their assets from the same volumes, read-only. nocopy: only
      # php — which starts first and owns the content as www-data — may seed a
      # fresh volume from its image; nginx must never populate it with
      # nginx-owned copies.
      - type: volume
        source: omeka_modules
        target: /var/www/html/modules
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: omeka_themes
        target: /var/www/html/themes
        read_only: true
        volume:
          nocopy: true
    environment:
      # Substituted into the nginx templates at container start (see
      # /etc/nginx/templates/). Values come from .env (gitignored).
      # NGINX_ENVSUBST_FILTER restricts envsubst to these variables so nginx's
      # own $uri, $http_*, etc. are preserved verbatim in the templates.
      - SERVER_NAME=${SERVER_NAME:-_}
      # CSP frame-ancestors: origins allowed to embed this site in an iframe.
      # Space-separated, keep the quotes around 'self' (see .env.example).
      - FRAME_ANCESTORS=${FRAME_ANCESTORS:-'self'}
      - NGINX_TRUSTED_PROXY_CIDR=${NGINX_TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      # Strict-Transport-Security max-age in seconds. nginx sends the header
      # only on requests the trusted proxy forwarded as HTTPS, never on plain
      # HTTP; 0 (the default) sends nothing. Set 31536000 once HTTPS is
      # confirmed working — or set HSTS on the TLS proxy instead, not both.
      - NGINX_HSTS_MAX_AGE=${NGINX_HSTS_MAX_AGE:-0}
      - NGINX_ENVSUBST_FILTER=^(SERVER_NAME|FRAME_ANCESTORS|NGINX_TRUSTED_PROXY_CIDR|NGINX_HSTS_MAX_AGE)$$
    depends_on:
      php:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      # The entrypoint runs as root and renders/owns everything here before
      # dropping to the nginx user for the workers, which only ever read it.
      # So these are root-owned 0755 rather than world-writable: a compromised
      # worker cannot then rewrite a rendered config or drop a file into the
      # cache directory.
      - /var/cache/nginx:mode=0755,size=64M
      - /var/run:mode=0755,size=1M
      - /tmp:mode=1777,size=64M
      # Holds nginx configs rendered from /etc/nginx/templates/ at startup.
      - /etc/nginx/conf.d:mode=0755,size=1M
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPU_LIMIT:-0.25}'
          memory: ${WEB_MEMORY_LIMIT:-256M}
          # Caps processes + threads, so a runaway or exploited process cannot
          # fork-bomb the host. nginx needs a master plus one worker per host CPU
          # (worker_processes auto); raise this only on a host with ~100+ cores.
          pids: 128
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -sfo /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        # Core/modules/themes are image content. Changing any of these values
        # requires rebuilding both php and web; the helper scripts do that.
        OMEKA_VERSION: ${OMEKA_VERSION:-4.2.1}
        EXTRA_MODULES_FILE: ${EXTRA_MODULES_FILE:-_docker/empty-modules.txt}
        EXTRA_THEMES_FILE: ${EXTRA_THEMES_FILE:-_docker/empty-themes.txt}
        EXTRA_MODULES: ${EXTRA_MODULES:-}
        EXTRA_THEMES: ${EXTRA_THEMES:-}
        ENABLE_IIIF: ${ENABLE_IIIF:-false}
        OMEKA_ASSET_REFRESH: ${OMEKA_ASSET_REFRESH:-stable}
    volumes:
      - omeka_media:/var/www/html/files:rw
      - omeka_logs:/var/www/html/logs:rw
      # Modules and themes are managed by site admins at runtime — through the
      # EasyAdmin module in the browser, or omeka-s-cli in this container —
      # so they live on volumes rather than in the read-only image layer.
      # The volumes are seeded from the image on first start, so the modules
      # and themes baked by the Dockerfile appear exactly as before; from then
      # on the volumes are authoritative and image rebuilds no longer change
      # them (scripts/rebuild-code.sh says so when it runs). Omeka core,
      # config, and vendor code stay immutable. To make modules and themes
      # immutable image content again, layer compose.immutable.yml.
      - omeka_modules:/var/www/html/modules:rw
      - omeka_themes:/var/www/html/themes:rw
      - ${OMEKA_LOCAL_CONFIG:-./_docker/local.config.php}:/var/www/html/config/local.config.php:ro
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./sideload:/var/www/html/sideload:rw
      # Persistent PHP session store (off tmpfs) so php restarts don't log
      # everyone out / invalidate CSRF tokens. See Dockerfile (92-sessions.ini).
      - php_sessions:/var/lib/php-sessions:rw
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE:-omeka}
      - MYSQL_USER=${MYSQL_USER:-omeka}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?You must set MYSQL_PASSWORD in .env}
      - OMEKA_VERSION=${OMEKA_VERSION:-4.2.1}
      # First-start only: with all three set, the entrypoint creates the first
      # admin and skips the browser installer. Remove them from .env after the
      # first start; the entrypoint warns while a password is still set on an
      # installed site.
      - OMEKA_ADMIN_EMAIL=${OMEKA_ADMIN_EMAIL:-}
      - OMEKA_ADMIN_PASSWORD=${OMEKA_ADMIN_PASSWORD:-}
      - OMEKA_ADMIN_USERNAME=${OMEKA_ADMIN_USERNAME:-}
      - OMEKA_TZ=${OMEKA_TZ:-}
      - OMEKA_LOCALE=${OMEKA_LOCALE:-}
      - OMEKA_TITLE=${OMEKA_TITLE:-}
      # Encrypts secrets at rest (module API keys and similar). Normally Omeka
      # generates config/secret_key.php on first boot, but config/ is immutable
      # image content here, so that write always fails and every admin page
      # carries a warning instead. This env var is the documented alternative
      # for exactly that case ("containers or managed hosting"). Generate once
      # with `openssl rand -base64 32` and then NEVER change it — anything
      # already encrypted with the old value becomes unreadable.
      - OMEKA_SECRET_KEY=${OMEKA_SECRET_KEY:-}
      # Session cookie flags. Secure must be true whenever visitors reach the
      # site over HTTPS (through a TLS proxy), so the cookie is never sent in
      # clear; it must stay false for plain-HTTP installs, where browsers would
      # drop a Secure cookie and nobody could log in.
      - OMEKA_SESSION_COOKIE_SECURE=${OMEKA_SESSION_COOKIE_SECURE:-false}
      - OMEKA_SESSION_COOKIE_SAMESITE=${OMEKA_SESSION_COOKIE_SAMESITE:-Lax}
      # At start the entrypoint installs modules that are on disk but not yet
      # installed in the database. false leaves that to the admin, so a module
      # an admin deliberately uninstalled stays uninstalled.
      - OMEKA_AUTO_INSTALL_MODULES=${OMEKA_AUTO_INSTALL_MODULES:-true}
      # PHP-FPM pool tuning (defaults in entrypoint if unset).
      # Five workers fit typical traffic, NOT five simultaneous 512M requests.
      # OPcache/APCu and tmpfs also count toward the 1536M container limit.
      # Measure peak usage during imports before increasing concurrency.
      - PHP_PM_MAX_CHILDREN=${PHP_PM_MAX_CHILDREN:-5}
      - PHP_PM_START_SERVERS=${PHP_PM_START_SERVERS:-2}
      - PHP_PM_MIN_SPARE_SERVERS=${PHP_PM_MIN_SPARE_SERVERS:-1}
      - PHP_PM_MAX_SPARE_SERVERS=${PHP_PM_MAX_SPARE_SERVERS:-3}
      - PHP_PM_MAX_REQUESTS=${PHP_PM_MAX_REQUESTS:-500}
      # Typesense connection for the DRESearch module (optional). The module
      # reads these when its admin settings are blank; leave TYPESENSE_API_KEY
      # unset to run without search (the module then no-ops gracefully).
      - TYPESENSE_HOST=${TYPESENSE_HOST:-typesense}
      - TYPESENSE_PORT=${TYPESENSE_PORT:-8108}
      - TYPESENSE_PROTOCOL=${TYPESENSE_PROTOCOL:-http}
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256M
      - /run/omeka:uid=33,gid=33,mode=0700,size=1M
      - /run/php-fpm:uid=33,gid=33,mode=0700,size=1M
      - /var/www/.cache:uid=33,gid=33,mode=0700,size=256M
    deploy:
      resources:
        limits:
          cpus: '${PHP_CPU_LIMIT:-1.0}'
          memory: ${PHP_CONTAINER_MEMORY:-1536M}
          # Processes + threads: FPM workers, plus the ImageMagick/Ghostscript
          # subprocesses (and their threads) that thumbnailing starts per request.
          pids: 512
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "env -i REQUEST_METHOD=GET SCRIPT_NAME=/status SCRIPT_FILENAME=/status cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q '^pool: *www'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:9.7.4@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
    # MySQL tuning parameters — see docs/DB_TUNING.md for explanations
    # --skip-log-bin: a single server with no replica, backed up with
    # mysqldump, has no use for binary logs, which otherwise pile up on the
    # data volume (4.9 GB on the reference host). DB_TUNING.md shows how to
    # turn them back on for point-in-time recovery.
    command: >-
      --innodb-buffer-pool-size=512M
      --innodb-log-buffer-size=32M
      --innodb-redo-log-capacity=256M
      --innodb-write-io-threads=4
      --innodb-read-io-threads=4
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=1
      --innodb-file-per-table=1
      --max-connections=50
      --table-open-cache=2000
      --tmp-table-size=32M
      --max-heap-table-size=32M
      --sort-buffer-size=2M
      --join-buffer-size=2M
      --thread-cache-size=8
      --skip-log-bin
    volumes:
      - mysql_data:/var/lib/mysql:rw
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-omeka}
      - MYSQL_USER=${MYSQL_USER:-omeka}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?You must set MYSQL_PASSWORD in .env}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      - backend
    restart: unless-stopped
    # Runs as the image's own mysql user (uid/gid 999 in the pinned image)
    # from the first process on, instead of starting as root and dropping
    # privileges. The entrypoint then skips its chown step, so it needs no
    # capabilities at all. The image's /var/lib/mysql is already owned by 999,
    # so a fresh named volume is seeded with that owner and initialises fine;
    # an existing volume was written by mysqld running as 999 all along.
    user: "999:999"
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Socket, mysqlx socket and pid file.
      - /var/run/mysqld:uid=999,gid=999,mode=0755,size=1M
      # tmpdir: filesort merge files and online-DDL sort files (innodb_tmpdir
      # defaults to it). Its pages count toward DB_MEMORY_LIMIT. An ALTER TABLE
      # that adds an index to a very large table can need more than this; see
      # docs/DB_TUNING.md if one fails with "No space left on device".
      - /tmp:uid=999,gid=999,mode=0700,size=256M
    deploy:
      resources:
        limits:
          cpus: '${DB_CPU_LIMIT:-0.5}'
          memory: ${DB_MEMORY_LIMIT:-1G}
          # MySQL is one process with a thread per connection plus ~40 background
          # threads; max-connections=50 keeps it far below this.
          pids: 512
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      # Ping over TCP (127.0.0.1), NOT localhost/the socket: during first-boot
      # initialization the MySQL entrypoint runs a temporary, socket-only
      # server (TCP disabled, "port: 0") while it creates users. A socket ping
      # succeeds against that temp server, marking db healthy before the real
      # server listens on 3306 — and php then races ahead into "connection
      # refused" during its install.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Typesense search backend for the DRESearch module.
  # Only starts when the "search" profile is active:
  #   docker compose --profile search up -d
  # Stays on the internal backend network — never published to the host; the
  # php service talks to it server-side at http://typesense:8108.
  typesense:
    # The pinned upstream release plus current Ubuntu security updates; the
    # release and its digest live in _docker/typesense/Dockerfile.
    build:
      context: _docker/typesense
    profiles:
      - search
    command:
      - "--data-dir=/data"
      - "--listen-port=8108"
      - "--enable-cors=false"
    environment:
      # Typesense reads any TYPESENSE_-prefixed variable as the matching
      # option, so the key is passed here rather than as --api-key: command-line
      # arguments are readable by every local user in the host's process list,
      # a process's environment only by its owner and root. (`docker inspect`
      # still shows it, but Docker access is root access anyway.)
      #
      # Defaults to empty so plain `docker compose up -d` (without the search
      # profile) never requires it. If you start the search profile without
      # setting it, Typesense exits immediately with a clear
      # "API key is not specified" error — set it in .env first.
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-}
    volumes:
      - typesense_data:/data:rw
    networks:
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    deploy:
      resources:
        limits:
          cpus: '${SEARCH_CPU_LIMIT:-0.5}'
          memory: ${SEARCH_MEMORY_LIMIT:-512M}
          # Typesense runs ~110 threads at idle (thread pools sized from the CPU
          # count), so this leaves room for growth without being unlimited.
          pids: 512
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      # Image ships bash but no curl/wget — probe /health over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\n\n' >&3; grep -q true <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    driver: local
  omeka_media:
    driver: local
  omeka_logs:
    driver: local
  omeka_modules:
    driver: local
  omeka_themes:
    driver: local
  typesense_data:
    driver: local
  php_sessions:
    driver: local

networks:
  frontend: {}
  # db and typesense only answer php; neither needs to reach anything else, so
  # this network has no route out of the host. Only php joins it from the
  # outside, and php keeps frontend for its own outbound traffic (module
  # downloads, external media). A compromised database or search process can
  # then neither phone home nor pull a payload in.
  backend:
    internal: true
