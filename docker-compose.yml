# Omeka S Docker Template
# A reusable Docker Compose configuration for Omeka S installations.
#
# This file is the generic base stack (web, php, db, optional typesense).
# Deployment-specific services and settings live in overlay files layered on
# top via COMPOSE_FILE in .env — see compose.amira.yml (the AMIRA production
# overlay) for a worked example.

services:
  web:
    # Build nginx from the same immutable Omeka code layer as PHP so module,
    # theme, and core assets can never drift between the two services.
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        OMEKA_VERSION: ${OMEKA_VERSION:-4.2.1}
        EXTRA_MODULES_FILE: ${EXTRA_MODULES_FILE:-_docker/empty-modules.txt}
        EXTRA_MODULES: ${EXTRA_MODULES:-}
        EXTRA_THEMES: ${EXTRA_THEMES:-}
        ENABLE_IIIF: ${ENABLE_IIIF:-false}
        OMEKA_ASSET_REFRESH: ${OMEKA_ASSET_REFRESH:-stable}
    ports:
      # NGINX_BIND controls the interface: the 127.0.0.1 default keeps nginx
      # reachable only through a reverse proxy on the host; set
      # NGINX_BIND=0.0.0.0 to serve HTTP directly (e.g. plain installs).
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-http-settings.conf:/etc/nginx/templates/00-http-settings.conf.template:ro
      # Rendered to /etc/nginx/conf.d/snippets/security-headers.conf so the
      # FRAME_ANCESTORS substitution applies to the snippet too.
      - ./nginx-security-headers.conf:/etc/nginx/templates/snippets/security-headers.conf.template:ro
      - omeka_media:/var/www/html/files:ro
    environment:
      # Substituted into the nginx templates at container start (see
      # /etc/nginx/templates/). Values come from .env (gitignored).
      # NGINX_ENVSUBST_FILTER restricts envsubst to these variables so nginx's
      # own $uri, $http_*, etc. are preserved verbatim in the templates.
      - SERVER_NAME=${SERVER_NAME:-_}
      # CSP frame-ancestors: origins allowed to embed this site in an iframe.
      # Space-separated, keep the quotes around 'self' (see .env.example).
      - FRAME_ANCESTORS=${FRAME_ANCESTORS:-'self'}
      - NGINX_ENVSUBST_FILTER=^(SERVER_NAME|FRAME_ANCESTORS)$$
    depends_on:
      php:
        condition: service_healthy
    networks:
      - frontend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777,size=64M
      - /var/run:mode=1777,size=1M
      - /tmp:mode=1777,size=64M
      # Holds nginx configs rendered from /etc/nginx/templates/ at startup.
      - /etc/nginx/conf.d:mode=1777,size=1M
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -sfo /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        # Core/modules/themes are image content. Changing any of these values
        # requires rebuilding both php and web; the helper scripts do that.
        OMEKA_VERSION: ${OMEKA_VERSION:-4.2.1}
        EXTRA_MODULES_FILE: ${EXTRA_MODULES_FILE:-_docker/empty-modules.txt}
        EXTRA_MODULES: ${EXTRA_MODULES:-}
        EXTRA_THEMES: ${EXTRA_THEMES:-}
        ENABLE_IIIF: ${ENABLE_IIIF:-false}
        OMEKA_ASSET_REFRESH: ${OMEKA_ASSET_REFRESH:-stable}
    volumes:
      - omeka_media:/var/www/html/files:rw
      - omeka_logs:/var/www/html/logs:rw
      - ${OMEKA_LOCAL_CONFIG:-./_docker/local.config.php}:/var/www/html/config/local.config.php:ro
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./sideload:/var/www/html/sideload:rw
      # Persistent PHP session store (off tmpfs) so php restarts don't log
      # everyone out / invalidate CSRF tokens. See Dockerfile (92-sessions.ini).
      - php_sessions:/var/lib/php-sessions:rw
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=${MYSQL_DATABASE:-omeka}
      - MYSQL_USER=${MYSQL_USER:-omeka}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?You must set MYSQL_PASSWORD in .env}
      - OMEKA_VERSION=${OMEKA_VERSION:-4.2.1}
      - OMEKA_ADMIN_EMAIL=${OMEKA_ADMIN_EMAIL:-}
      - OMEKA_ADMIN_PASSWORD=${OMEKA_ADMIN_PASSWORD:-}
      - OMEKA_ADMIN_USERNAME=${OMEKA_ADMIN_USERNAME:-}
      - OMEKA_TZ=${OMEKA_TZ:-}
      - OMEKA_LOCALE=${OMEKA_LOCALE:-}
      - OMEKA_TITLE=${OMEKA_TITLE:-}
      # PHP-FPM pool tuning (defaults in entrypoint if unset).
      # Sized for the ~1.5 GiB php container: with memory_limit=512M and
      # ~512M of shared OPcache+APCu, 5 workers keep worst-case RSS under the
      # limit. Raise PHP_PM_MAX_CHILDREN in .env on a larger host.
      - PHP_PM_MAX_CHILDREN=${PHP_PM_MAX_CHILDREN:-5}
      - PHP_PM_START_SERVERS=${PHP_PM_START_SERVERS:-2}
      - PHP_PM_MIN_SPARE_SERVERS=${PHP_PM_MIN_SPARE_SERVERS:-1}
      - PHP_PM_MAX_SPARE_SERVERS=${PHP_PM_MAX_SPARE_SERVERS:-3}
      - PHP_PM_MAX_REQUESTS=${PHP_PM_MAX_REQUESTS:-500}
      # Typesense connection for the DRESearch module (optional). The module
      # reads these when its admin settings are blank; leave TYPESENSE_API_KEY
      # unset to run without search (the module then no-ops gracefully).
      - TYPESENSE_HOST=${TYPESENSE_HOST:-typesense}
      - TYPESENSE_PORT=${TYPESENSE_PORT:-8108}
      - TYPESENSE_PROTOCOL=${TYPESENSE_PROTOCOL:-http}
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256M
      - /run/omeka:uid=33,gid=33,mode=0700,size=1M
      - /run/php-fpm:uid=33,gid=33,mode=0700,size=1M
      - /var/www/.cache:uid=33,gid=33,mode=0700,size=256M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "env -i REQUEST_METHOD=GET SCRIPT_NAME=/status SCRIPT_FILENAME=/status cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q '^pool: *www'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:9.7.2@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
    # MySQL tuning parameters — see docs/DB_TUNING.md for explanations
    command: >-
      --innodb-buffer-pool-size=512M
      --innodb-log-buffer-size=32M
      --innodb-redo-log-capacity=256M
      --innodb-write-io-threads=4
      --innodb-read-io-threads=4
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=2
      --innodb-file-per-table=1
      --max-connections=250
      --table-open-cache=400
      --tmp-table-size=32M
      --max-heap-table-size=32M
      --sort-buffer-size=2M
      --join-buffer-size=2M
      --thread-cache-size=8
    volumes:
      - mysql_data:/var/lib/mysql:rw
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-omeka}
      - MYSQL_USER=${MYSQL_USER:-omeka}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?You must set MYSQL_PASSWORD in .env}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      # Ping over TCP (127.0.0.1), NOT localhost/the socket: during first-boot
      # initialization the MySQL entrypoint runs a temporary, socket-only
      # server (TCP disabled, "port: 0") while it creates users. A socket ping
      # succeeds against that temp server, marking db healthy before the real
      # server listens on 3306 — and php then races ahead into "connection
      # refused" during its install.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Typesense search backend for the DRESearch module.
  # Only starts when the "search" profile is active:
  #   docker compose --profile search up -d
  # Stays on the internal backend network — never published to the host; the
  # php service talks to it server-side at http://typesense:8108.
  typesense:
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    profiles:
      - search
    # NOTE: TYPESENSE_API_KEY defaults to empty so plain `docker compose up -d`
    # (without the search profile) never requires it. If you start the search
    # profile without setting it, Typesense exits immediately with a clear
    # "API key is not specified" error — set it in .env first.
    command:
      - "--data-dir=/data"
      - "--api-key=${TYPESENSE_API_KEY:-}"
      - "--listen-port=8108"
      - "--enable-cors=false"
    volumes:
      - typesense_data:/data:rw
    networks:
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      # Image ships bash but no curl/wget — probe /health over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\n\n' >&3; grep -q true <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    driver: local
  omeka_media:
    driver: local
  omeka_logs:
    driver: local
  typesense_data:
    driver: local
  php_sessions:
    driver: local

networks:
  frontend: {}
  backend: {}
