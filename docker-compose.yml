# Omeka S Docker Template
# A reusable Docker Compose configuration for Omeka S installations

services:
  web:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx-http-settings.conf:/etc/nginx/templates/00-http-settings.conf.template:ro
      - ./nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - omeka_files:/var/www/html:ro
    environment:
      # Substituted into nginx.conf at container start (see /etc/nginx/templates/).
      # SERVER_NAME comes from .env (gitignored). NGINX_ENVSUBST_FILTER restricts
      # envsubst to only this variable so nginx's own $uri, $http_*, etc. are
      # preserved verbatim in the templates.
      - SERVER_NAME=${SERVER_NAME:-_}
      - NGINX_ENVSUBST_FILTER=^SERVER_NAME$$
    depends_on:
      php:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=1777,size=64M
      - /var/run:mode=1777,size=1M
      - /tmp:mode=1777,size=64M
      # Holds nginx configs rendered from /etc/nginx/templates/ at startup.
      - /etc/nginx/conf.d:mode=1777,size=1M
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -sfo /dev/null http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - omeka_files:/var/www/html:rw
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./sideload:/var/www/html/sideload:rw
      # Persistent PHP session store (off tmpfs) so php restarts don't log
      # everyone out / invalidate CSRF tokens. See Dockerfile (92-sessions.ini).
      - php_sessions:/var/lib/php-sessions:rw
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=omeka
      - MYSQL_USER=omeka
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - OMEKA_VERSION=${OMEKA_VERSION:-4.2.0}
      - OMEKA_ADMIN_EMAIL=${OMEKA_ADMIN_EMAIL:-}
      - OMEKA_ADMIN_PASSWORD=${OMEKA_ADMIN_PASSWORD:-}
      - OMEKA_ADMIN_USERNAME=${OMEKA_ADMIN_USERNAME:-}
      - OMEKA_TZ=${OMEKA_TZ:-}
      - OMEKA_LOCALE=${OMEKA_LOCALE:-}
      - OMEKA_TITLE=${OMEKA_TITLE:-}
      # PHP-FPM pool tuning (defaults in entrypoint if unset)
      - PHP_PM_MAX_CHILDREN=${PHP_PM_MAX_CHILDREN:-10}
      - PHP_PM_START_SERVERS=${PHP_PM_START_SERVERS:-3}
      - PHP_PM_MIN_SPARE_SERVERS=${PHP_PM_MIN_SPARE_SERVERS:-2}
      - PHP_PM_MAX_SPARE_SERVERS=${PHP_PM_MAX_SPARE_SERVERS:-5}
      - PHP_PM_MAX_REQUESTS=${PHP_PM_MAX_REQUESTS:-500}
      # Extra modules/themes installed by entrypoint (comma-separated names)
      - EXTRA_MODULES=${EXTRA_MODULES:-}
      - EXTRA_THEMES=${EXTRA_THEMES:-}
      # Set to "true" to install IIIF modules (IiifServer, ImageServer, Mirador)
      - ENABLE_IIIF=${ENABLE_IIIF:-false}
      # Typesense connection for the DRESearch module (optional). The module
      # reads these when its admin settings are blank; leave TYPESENSE_API_KEY
      # unset to run without search (the module then no-ops gracefully).
      - TYPESENSE_HOST=${TYPESENSE_HOST:-typesense}
      - TYPESENSE_PORT=${TYPESENSE_PORT:-8108}
      - TYPESENSE_PROTOCOL=${TYPESENSE_PROTOCOL:-http}
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777,size=256M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mysql:9.7
    # MySQL tuning parameters — see docs/DB_TUNING.md for explanations
    command: >-
      --innodb-buffer-pool-size=512M
      --innodb-buffer-pool-instances=2
      --innodb-log-buffer-size=32M
      --innodb-redo-log-capacity=256M
      --innodb-write-io-threads=4
      --innodb-read-io-threads=4
      --innodb-flush-method=O_DIRECT
      --innodb-flush-log-at-trx-commit=2
      --innodb-file-per-table=1
      --max-connections=250
      --table-open-cache=400
      --tmp-table-size=32M
      --max-heap-table-size=32M
      --sort-buffer-size=2M
      --join-buffer-size=2M
      --thread-cache-size=8
    volumes:
      - mysql_data:/var/lib/mysql:rw
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-omeka}
      - MYSQL_USER=${MYSQL_USER:-omeka}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?You must set MYSQL_PASSWORD in .env}
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Typesense search backend for the DRESearch module.
  # Only starts when the "search" profile is active:
  #   docker compose --profile search up -d
  # Stays on the internal backend network — never published to the host; the
  # php service talks to it server-side at http://typesense:8108.
  typesense:
    image: typesense/typesense:27.1  # bump to a newer stable tag (29.x/30.x) as needed
    profiles:
      - search
    # NOTE: TYPESENSE_API_KEY defaults to empty so plain `docker compose up -d`
    # (without the search profile) never requires it. If you start the search
    # profile without setting it, Typesense exits immediately with a clear
    # "API key is not specified" error — set it in .env first.
    command:
      - "--data-dir=/data"
      - "--api-key=${TYPESENSE_API_KEY:-}"
      - "--listen-port=8108"
      - "--enable-cors=false"
    volumes:
      - typesense_data:/data:rw
    networks:
      - backend
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      # Image ships bash but no curl/wget — probe /health over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\n\n' >&3; grep -q true <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
    driver: local
  omeka_files:
    driver: local
  typesense_data:
    driver: local
  php_sessions:
    driver: local

networks:
  frontend: {}
  backend: {}
