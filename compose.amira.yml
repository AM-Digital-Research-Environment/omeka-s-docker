# AMIRA deployment overlay — the DRE production stack at
# data.africamultiple.uni-bayreuth.de. Layers the AMIRA-specific pieces on top
# of the generic base stack in docker-compose.yml:
#
#   - amira-mcp service (MCP server for the public AMIRA dataset at /mcp)
#   - /mcp nginx location (deploy/amira/nginx-mcp-location.conf)
#   - /favicon.ico nginx location (deploy/amira/nginx-favicon-location.conf)
#   - /.well-known/void nginx location (deploy/amira/nginx-well-known-void-location.conf)
#   - dre: vocabulary at /ontology/dre (deploy/amira/nginx-dre-vocabulary-*.conf)
#   - optional sparql service, a read-only SPARQL endpoint over the
#     DRE-LinkedData dump at /sparql (profile "sparql"; deploy/amira/sparql/)
#   - optional amira-mcp-curator service, the internal MCP endpoint that also
#     serves private records to curators at /curator/mcp (profile "curator";
#     deploy/amira/README.md#curator-mcp-endpoint)
#   - DRE modules baked into the php image (deploy/amira/modules.txt)
#   - dre custom vocabulary (deploy/amira/vocabularies/)
#
# Activate it in .env (see deploy/amira/README.md for the full walk-through):
#
#   COMPOSE_FILE=docker-compose.yml:compose.amira.yml
#   COMPOSE_PROFILES=search
#   FRAME_ANCESTORS="'self' https://www.frederickmadore.com https://slides.frederickmadore.com"
#
# Plain `docker compose up -d` then behaves exactly as before. Without these
# lines the base stack runs standalone — this file also serves as the worked
# example of extending the template with deployment-specific services.

services:
  web:
    build:
      args:
        EXTRA_MODULES_FILE: deploy/amira/modules.txt
        # Must stay identical to the php service below: the two targets share
        # one code layer, and CI asserts their build args match exactly.
        EXTRA_THEMES_FILE: deploy/amira/themes.txt
    volumes:
      # Rendered by the nginx image's envsubst step into
      # /etc/nginx/conf.d/extra-locations/mcp.conf, which the base nginx.conf
      # includes by glob (see the extension point in nginx.conf).
      - ./deploy/amira/nginx-mcp-location.conf:/etc/nginx/templates/extra-locations/mcp.conf.template:ro
      # Serves the DRE-theme icon at /favicon.ico (same extension point).
      - ./deploy/amira/nginx-favicon-location.conf:/etc/nginx/templates/extra-locations/favicon.conf.template:ro
      # Lets /.well-known/void through to DRE-LinkedData (same extension point).
      - ./deploy/amira/nginx-well-known-void-location.conf:/etc/nginx/templates/extra-locations/well-known-void.conf.template:ro
      # Serves the dre: vocabulary at /ontology/dre: the negotiation map goes in
      # the http context (templates/ root -> conf.d/), the locations at the
      # extension point, and the generated files in a read-only directory.
      - ./deploy/amira/nginx-dre-vocabulary-map.conf:/etc/nginx/templates/01-dre-vocabulary.conf.template:ro
      - ./deploy/amira/nginx-dre-vocabulary-location.conf:/etc/nginx/templates/extra-locations/dre-vocabulary.conf.template:ro
      - ./deploy/amira/vocabularies:/srv/dre-vocabulary:ro
      # /sparql: rate and concurrency zones in the http context, the location
      # at the extension point, and the socket the sparql service listens on.
      # Mounted whether or not the "sparql" profile is on; without it the
      # socket is absent and /sparql answers 503.
      - ./deploy/amira/nginx-sparql-limits.conf:/etc/nginx/templates/02-sparql.conf.template:ro
      - ./deploy/amira/nginx-sparql-location.conf:/etc/nginx/templates/extra-locations/sparql.conf.template:ro
      - sparql_socket:/srv/sparql:ro
      # /curator/mcp, proxied to amira-mcp-curator over the curator network.
      # Mounted whether or not the "curator" profile is on; without it the
      # location answers 502 and the rest of the site is unaffected.
      - ./deploy/amira/nginx-curator-mcp-location.conf:/etc/nginx/templates/extra-locations/curator-mcp.conf.template:ro
      # No DreVisualizations mount here any more. Up to v2.28.x nginx served the
      # precomputed dashboard JSON straight from the module's asset/data tree;
      # v2.29.0 moved generated data to private storage served through a
      # no-store Omeka endpoint, so nginx has nothing to read. What remains
      # under asset/ is the module's shipped static geography, which comes from
      # the omeka_modules volume like any other extension asset.
    networks:
      - frontend
      - mcp
      - curator

  php:
    build:
      args:
        # Bake the DRE modules into the image on top of
        # _docker/default-modules.txt (see Dockerfile).
        EXTRA_MODULES_FILE: deploy/amira/modules.txt
        # DRE-theme, downloaded from GitHub and renamed to the directory the
        # site rows expect (see deploy/amira/themes.txt). Scoping it here keeps
        # the generic base image free of AMIRA branding.
        EXTRA_THEMES_FILE: deploy/amira/themes.txt
    volumes:
      # dre vocabulary + its import manifest, picked up on first run by the
      # entrypoint's vocabulary import alongside the generic vocabularies
      # baked into the image at build.
      - ./deploy/amira/vocabularies/dre.rdf:/usr/local/share/omeka-vocabs/dre.rdf:ro
      - ./deploy/amira/vocabularies/dre.json:/usr/local/share/omeka-vocabs/dre.json:ro
      # DreVisualizations generated state (v2.29.0+). The "Regenerate" job
      # writes precomputed dashboard, knowledge-graph and photo-gallery
      # artifacts here, and Omeka serves the current generation through a
      # no-store endpoint. It is deliberately OUTSIDE the document root: the
      # module rejects web-root paths and directory symlinks outright, and
      # nothing here should ever be reachable as a static file.
      #
      # Up to v2.28.x this was a volume mounted over the module's own
      # asset/data tree, which nginx then served directly. That had two
      # standing problems this replaces: the mount shadowed the module's
      # shipped static inputs so a release could not update them without the
      # volume being deleted by hand, and an in-container module update
      # detached the mount, forcing a php+web recreate afterwards. Neither
      # applies now — asset/ is ordinary extension content on omeka_modules.
      #
      # If DRE_VISUALIZATIONS_DATA_DIR were left unset the module would fall
      # back to an OS temporary directory, which a host cleanup can delete,
      # silently costing the published visualizations until someone regenerates.
      #
      # Contents are disposable and deliberately NOT backed up: scripts/backup.sh
      # ignores this volume and everything in it is rebuilt from MySQL by the
      # admin "Regenerate" action. Disaster recovery is restore the database and
      # media, start the stack, then regenerate.
      - dre_visualizations_private:/var/lib/omeka/dre-visualizations:rw
    environment:
      # Durable private storage for the generated artifacts above. Must match
      # the mount, and must stay outside /var/www/html.
      - DRE_VISUALIZATIONS_DATA_DIR=/var/lib/omeka/dre-visualizations

  # AMIRA MCP server — exposes the public, read-only AMIRA dataset over
  # Streamable-HTTP/SSE at POST /mcp (health: GET /healthz) on port 8787.
  # Reached only through the web nginx (location ^~ /mcp); never published to
  # the host. Built from an upstream release tag, never a floating branch.
  # Update AMIRA_MCP_VERSION with deploy/amira/update-amira-mcp.sh.
  #
  # web declares no dependency on this service: the /mcp location resolves the
  # upstream at request time via Docker's embedded DNS, so the site boots — and
  # stays up — even when amira-mcp is missing, stopped, or still building. /mcp
  # just returns 502 until amira-mcp is reachable again.
  amira-mcp:
    build:
      context: https://github.com/AM-Digital-Research-Environment/amira-mcp-server.git#${AMIRA_MCP_VERSION:-v1.35.0}
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      # Periodically refreshes the bundled snapshot from AMIRA_SITE_BASE.
      - AMIRA_LIVE_REFRESH=true
      - AMIRA_CACHE_DIR=/tmp/amira-cache
      # The server's rate limit (AMIRA_RATE_LIMIT, default 120 requests/minute)
      # is keyed on the TCP peer address unless this is set. Every request
      # arrives from the web nginx container, so without it all visitors share
      # one 120/min bucket and a single busy client locks out everyone else.
      # With it the key comes from X-Forwarded-For, so each visitor gets their
      # own budget.
      #
      # SAFE ONLY BECAUSE the /mcp location OVERWRITES that header with the one
      # client address this stack resolved itself. The header is the rate-limit
      # key once this is on, so any entry a caller can write is a fresh budget
      # they can mint per request. Do not enable this without the matching
      # `proxy_set_header X-Forwarded-For $remote_addr` in
      # deploy/amira/nginx-mcp-location.conf; the Compose contract check
      # (.github/scripts/check-compose.py) ties the two together.
      - AMIRA_TRUST_PROXY=true
      # Citation URLs and live-refresh target our own public domain.
      - AMIRA_SITE_BASE=https://${SERVER_NAME:?You must set SERVER_NAME when using compose.amira.yml}
      - AMIRA_SITE_SLUG=amira
    networks:
      - mcp
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Holds AMIRA_CACHE_DIR (read-only rootfs otherwise).
      - /tmp:mode=1777,size=128M
    deploy:
      resources:
        limits:
          cpus: '0.25'
          # 384M, not 256M: measured at 155M of 256M (60%) and growing with the
          # bundled snapshot that AMIRA_LIVE_REFRESH re-crawls, and a Node heap
          # that reaches its limit is OOM-killed rather than slowed. At 384M it
          # settles around 33%.
          #
          # This does add 128M to the stack's ceiling total, which on a small
          # host is already more than the host has — see the oversubscription
          # note in docs/PRODUCTION.md. Measure before trimming something else
          # to compensate: `docker stats` right after a recreate reads much
          # higher than a long-running container (page cache), so a figure taken
          # from an idle container will mislead you.
          memory: 384M
        reservations:
          cpus: '0.05'
          memory: 64M
    # Same probe as the upstream image, with timings that fit the 0.25-CPU
    # limit above. The probe starts a whole second Node process, and V8 startup
    # alone overruns the upstream 3s timeout often enough that the container
    # flaps between healthy and unhealthy while serving every request fine.
    # A longer timeout costs nothing; the interval is stretched too, because
    # each probe is a real slice of the CPU budget. start_period covers the
    # snapshot crawl the server runs at boot, which saturates that budget.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Read-only SPARQL endpoint over the DRE-LinkedData dump, reached at /sparql
  # through the web nginx (deploy/amira/nginx-sparql-location.conf). OPT-IN:
  # starts only with the "sparql" profile, e.g. COMPOSE_PROFILES=search,sparql,
  # and needs the dump the DRELinkedData module writes to
  # files/dre-linked-data/. See deploy/amira/README.md#sparql-endpoint.
  #
  # Oxigraph, wrapped by deploy/amira/sparql/sparql-entrypoint.sh, which loads
  # the dump into a fresh store, swaps it in only once complete, and reloads
  # whenever the module publishes a new dump. Everything in it is rebuilt from
  # that dump, so nothing here is backed up.
  #
  # Sized so it cannot slow the site down: at ~220k triples it idles under
  # 20M, a reload takes a few seconds, and a query that outruns its timeout is
  # stopped by the entrypoint's watchdog. cpu_shares gives Omeka priority
  # whenever the two compete for the CPU.
  sparql:
    build:
      context: deploy/amira/sparql
    profiles:
      - sparql
    # No network at all, not even a private one. Oxigraph executes SPARQL
    # SERVICE clauses as outbound HTTP requests and cannot be told not to; on
    # any Docker network a public query could aim them at Omeka or at the
    # host's own ports. The web nginx talks to it over the socket below.
    network_mode: none
    environment:
      - SPARQL_DUMP_DIR=/media/dre-linked-data
      # Seconds a query may run. nginx-sparql-location.conf waits a little
      # longer; raise both together.
      - SPARQL_QUERY_TIMEOUT=30
      # Seconds a whole request may take, streaming the result included,
      # before its connection is closed.
      - SPARQL_REQUEST_LIMIT=60
      # Seconds between checks of state.json for a new dump.
      - SPARQL_POLL_INTERVAL=60
    volumes:
      # Read-only, and nocopy so this service never seeds the media volume.
      - type: volume
        source: omeka_media
        target: /media
        read_only: true
        volume:
          nocopy: true
      - sparql_data:/data:rw
      - sparql_socket:/run/sparql:rw
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16M
    # A quarter of the default weight: under contention php, db and web get
    # the CPU first.
    cpu_shares: 256
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 32M
    # Probes the same path nginx uses: a request through the socket.
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /sparql HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | socat -t5 - UNIX-CONNECT:/run/sparql/sparql.sock | head -n 1 | grep -q ' 200 '"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The first load of a ~220k-triple dump takes a few seconds; this also
      # covers a slow disk.
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AMIRA curator MCP server: the same amira-mcp-server code as amira-mcp,
  # started with AMIRA_ACCESS=curator. It crawls the Omeka API with a service
  # key, so it also sees private records and private values, and serves them
  # only to curators holding a personal token (it checks the token itself and
  # logs one audit line per request). Reached at /curator/mcp through the web
  # nginx (deploy/amira/nginx-curator-mcp-location.conf); never published to
  # the host. OPT-IN: starts only with the "curator" profile, e.g.
  # COMPOSE_PROFILES=search,curator. Needs the secrets directory below first;
  # see deploy/amira/README.md#curator-mcp-endpoint.
  #
  # Its own version variable rather than AMIRA_MCP_VERSION: curator mode is
  # not in a release yet (amira-mcp-server PR #39), so this service has to
  # build from a branch or commit while amira-mcp stays on its release tag,
  # and update-amira-mcp.sh must not move it. Set AMIRA_MCP_CURATOR_VERSION in
  # .env to anything a Docker git context accepts after "#": a full commit SHA
  # (preferred, since it cannot move), a branch such as feat/curator-mode, or
  # the release tag once curator mode ships. Left unset, the ref below does not
  # exist, so the build fails naming the variable. Falling back to
  # AMIRA_MCP_VERSION instead would start a release that ignores AMIRA_ACCESS
  # and serves the public data at /curator/mcp with no token required.
  amira-mcp-curator:
    build:
      context: https://github.com/AM-Digital-Research-Environment/amira-mcp-server.git#${AMIRA_MCP_CURATOR_VERSION:-AMIRA_MCP_CURATOR_VERSION-is-not-set}
    profiles:
      - curator
    # Runs as the owner of the secrets directory, so the key file can stay
    # 0600 on the host. The image's own user (node, uid 1000) is only the
    # default: uid 1000 is usually a real login on the host, and making the
    # key readable to it would hand that account the key. Set both in .env to
    # `id -u` and `id -g` of the owner of AMIRA_CURATOR_SECRETS_DIR.
    user: "${AMIRA_CURATOR_UID:-1000}:${AMIRA_CURATOR_GID:-1000}"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - AMIRA_ACCESS=curator
      # Two bases. AMIRA_SITE_BASE is the public site, the same as amira-mcp's:
      # every link the server returns (amira_url, admin_url, citations) is
      # built from it, so curators can open them. AMIRA_API_BASE is where the
      # keyed crawl goes: the web nginx over the curator network, so requests
      # carrying the Omeka key never leave the host or pass the host's TLS
      # proxy and its access log. nginx serves it from its only server block
      # whatever the Host header. The Compose contract check holds both.
      #
      # AMIRA_API_BASE needs an amira-mcp-server commit that supports it (PR
      # #39). An older one ignores it and crawls AMIRA_SITE_BASE/api, i.e.
      # sends the key out to the public URL: pin AMIRA_MCP_CURATOR_VERSION to a
      # commit that has it.
      - AMIRA_SITE_BASE=https://${SERVER_NAME:?You must set SERVER_NAME when using compose.amira.yml}
      - AMIRA_API_BASE=http://web/api
      - AMIRA_SITE_SLUG=amira
      - AMIRA_LIVE_REFRESH=true
      # Both files are re-read while running: tokens every 2 s at most (delete
      # a line to revoke), the key every minute (rotation needs no restart).
      - AMIRA_OMEKA_KEY_FILE=/run/secrets/amira-curator/omeka-key
      - AMIRA_MCP_TOKENS_FILE=/run/secrets/amira-curator/tokens
      # Private data: on the tmpfs below, never on a volume. Curator mode
      # refuses to start without this set explicitly.
      - AMIRA_CACHE_DIR=/var/cache/amira-curator
      # Data Omeka has not confirmed for this long is refused; the refresh
      # interval must stay below it. Both are the upstream defaults, stated
      # so the pair is visible.
      - AMIRA_CURATOR_MAX_STALE_HOURS=24
      - AMIRA_REFRESH_INTERVAL_HOURS=1
      # Per-curator rate limit instead of one bucket for everyone behind the
      # proxy. Safe only because the /curator/mcp location overwrites
      # X-Forwarded-For; see the amira-mcp service above, and the Compose
      # contract check, which ties the two.
      - AMIRA_TRUST_PROXY=true
    volumes:
      # The Omeka key (omeka-key) and the personal tokens (tokens), gitignored.
      # The directory is mounted rather than each file: a bind-mounted file
      # keeps pointing at the old inode once an editor or `sed -i` replaces it,
      # so a deleted token line would never reach the server. Missing directory
      # = refuse to start (create_host_path: false), never an empty one.
      - type: bind
        source: ${AMIRA_CURATOR_SECRETS_DIR:-./deploy/amira/curator-secrets}
        target: /run/secrets/amira-curator
        read_only: true
        bind:
          create_host_path: false
    # Its own network, shared only with web: it can reach the Omeka API
    # through nginx, and nothing but nginx can reach it, the public amira-mcp
    # included. It cannot reach the database or the search index. Not
    # internal, because the server fetches its GitHub-hosted enrichments
    # (full-text map, corpus vectors), as amira-mcp does.
    networks:
      - curator
    restart: unless-stopped
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # AMIRA_CACHE_DIR: owner-only, and gone when the container stops. Its
      # pages count against the memory limit below.
      - /var/cache/amira-curator:uid=${AMIRA_CURATOR_UID:-1000},gid=${AMIRA_CURATOR_GID:-1000},mode=0700,size=128M
      - /tmp:mode=1777,size=16M
    deploy:
      resources:
        limits:
          cpus: '0.25'
          # 384M to match amira-mcp. UNMEASURED: the curator snapshot adds the
          # private records and the private ILAM OCR full text, which has not
          # been counted yet, and the cache tmpfs above is charged to the same
          # limit. Measure with the cgroup counters in docs/PRODUCTION.md once
          # it runs, and resize from that.
          memory: 384M
        reservations:
          cpus: '0.05'
          memory: 64M
    # Same probe and timings as amira-mcp. /healthz shows liveness and
    # freshness only (no counts) in curator mode, and answers 503 while the
    # first keyed crawl runs or once Omeka refuses the key. start_period is
    # longer because nothing is served before that crawl completes: curator
    # mode never falls back to the bundled public snapshot.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 600s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mcp: {}
  # amira-mcp-curator and web only (see the service above).
  curator: {}

volumes:
  # Precomputed DreVisualizations artifacts, private storage outside the
  # document root (see the php service above). Replaces the pre-2.29
  # dre_visualizations_data volume, which was mounted over the module's
  # asset/data tree; that old volume is now unused and can be removed once a
  # successful regeneration confirms this one works:
  #   docker volume rm omeka-s-docker_dre_visualizations_data
  dre_visualizations_private:
    driver: local
  # Oxigraph stores built from the dump by the sparql service: the one being
  # served, plus the next one while a reload runs. Disposable and not backed
  # up; a fresh volume is rebuilt from the dump on start.
  sparql_data:
    driver: local
  # Holds only the sparql service's Unix socket, shared with web. A tmpfs, so
  # a stale socket never outlives a restart, owned by the service's fixed uid
  # (deploy/amira/sparql/Dockerfile) so it can create the socket there.
  sparql_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,uid=10001,gid=10001,mode=0755"
