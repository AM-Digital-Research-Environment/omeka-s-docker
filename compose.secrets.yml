# File-based secrets overlay — keeps the four credentials out of .env and out
# of the container configuration.
#
# By default MYSQL_PASSWORD, OMEKA_SECRET_KEY, TYPESENSE_API_KEY and
# OMEKA_ADMIN_PASSWORD travel as environment variables from .env, so they show
# in `docker compose config`, in `docker inspect` and in every process
# environment of the containers. With this overlay each one is a file in a
# directory outside the repository instead, mounted read-only at
# /run/secrets/<name> into only the services that need it. The containers get
# MYSQL_PASSWORD_FILE, TYPESENSE_API_KEY_FILE, ... pointing at those files and
# the entrypoints read them (the official mysql image natively; the php and
# typesense images through their entrypoint wrappers).
#
# What this does NOT hide, stated plainly:
#   - Omeka (the Common module) reads OMEKA_SECRET_KEY and the DRESearch module
#     reads TYPESENSE_API_KEY with getenv(), so the php entrypoint exports both
#     before starting php-fpm: they are still in the php-fpm process
#     environment (/proc/1/environ inside the container, getenv() in every
#     request). Likewise Typesense reads its key from its own environment.
#   - MYSQL_PASSWORD is NOT exported to php-fpm in either mode: the entrypoint
#     writes it into /run/omeka/database.ini (tmpfs, 0600) and drops it.
#   - Anyone who can run `docker exec` can still read the files; Docker access
#     is root access anyway.
#   - `docker compose exec php ...` sessions do not inherit what the entrypoint
#     exported. A CLI command that needs OMEKA_SECRET_KEY or TYPESENSE_API_KEY
#     must load it from the file itself (scripts/update-extensions.sh does;
#     docs/CONFIGURATION.md shows the one-liner).
#
# ---------------------------------------------------------------------------
# Setup (run from the project directory; see docs/CONFIGURATION.md for
# switching an existing installation):
#
#   install -d -m 0700 secrets
#   ( umask 022
#     printf '%s' 'the-database-password'        > secrets/mysql_password
#     openssl rand -base64 32 | tr -d '\n'       > secrets/omeka_secret_key
#     : > secrets/typesense_api_key      # empty = search not configured
#     : > secrets/omeka_admin_password   # empty = generate one at install
#   )
#
# and in .env:
#
#   COMPOSE_FILE=docker-compose.yml:compose.secrets.yml
#   SECRETS_DIR=./secrets
#
# then delete MYSQL_PASSWORD, OMEKA_SECRET_KEY, TYPESENSE_API_KEY and
# OMEKA_ADMIN_PASSWORD from .env. php refuses to start while any of them is
# still set there, rather than silently ignoring one of two values.
#
# ALL FOUR FILES MUST EXIST. Compose cannot make a secret optional: a missing
# file stops `docker compose up`. An EMPTY file means "not set", exactly like
# an empty variable in .env: no Typesense key (search off), no OMEKA_SECRET_KEY,
# and no configured first admin, so the first install creates admin@example.com
# (or OMEKA_ADMIN_EMAIL) with a random password it prints once in
# `docker compose logs php`. Only mysql_password must hold a value. One
# overlay with four files was chosen over one overlay per secret because
# COMPOSE_FILE combinations would multiply, and an empty file is the same
# convention the variables already follow.
#
# FILE MODES. Compose (outside Swarm) bind-mounts each file as it is on the
# host: owner and mode are kept, and the uid/gid/mode keys of the long
# `secrets:` syntax are not a reliable way to change that, so this overlay
# does not use them. The containers read the files as different users —
# mysql_password as uid 999 (db) and uid 33 (php), typesense_api_key as uid 33
# and uid 10002 (typesense) — so no single owner works. Instead:
#
#   secrets/        0700, owned by the operator: other host users cannot even
#                   reach the files. Bind mounts are set up by the Docker
#                   daemon, so the containers do not need to traverse it.
#   secrets/*       0644 (or 0444): readable inside the containers they are
#                   mounted into, by whichever uid the service runs as.
#
# A 0600 file owned by your login is unreadable inside the containers, and the
# entrypoints then fail naming the file.
#
# Editing a secret: bind mounts follow the inode, and editors and `sed -i`
# replace the file with a new one, so recreate the affected services after any
# change: `docker compose up -d --force-recreate php db typesense`. Changing
# mysql_password does NOT change the database user's password — see
# docs/CONFIGURATION.md for the rotation steps.
#
# ---------------------------------------------------------------------------
# ORDER. List this file after docker-compose.yml and after compose.immutable.yml
# if you use it, before deployment overlays:
#
#   COMPOSE_FILE=docker-compose.yml:compose.secrets.yml
#   COMPOSE_FILE=docker-compose.yml:compose.immutable.yml:compose.secrets.yml
#   COMPOSE_FILE=docker-compose.yml:compose.secrets.yml:compose.amira.yml
#   COMPOSE_FILE=docker-compose.yml:compose.immutable.yml:compose.secrets.yml:compose.amira.yml
#
# It touches only environment entries and secrets, never volume lists, so it
# does not conflict with compose.immutable.yml's `!override`; CI renders and
# checks each of these combinations (.github/scripts/check-compose.py).
#
# HOW THE BASE FILE COOPERATES. docker-compose.yml requires MYSQL_PASSWORD,
# and Compose interpolates every file before merging, so an overlay cannot
# lift that requirement by itself. The base therefore accepts SECRETS_DIR in
# place of MYSQL_PASSWORD; that is why SECRETS_DIR has no default here and
# must be set in .env. Without this overlay, a set SECRETS_DIR leaves a marker
# value ("compose.secrets.yml-is-not-loaded:...") that the php entrypoint
# rejects, so forgetting the overlay in COMPOSE_FILE fails loudly instead of
# running with a bogus password.

services:
  php:
    environment:
      # `!reset null` deletes the key the base file defines, so no plain value
      # — not even an empty one — reaches the container configuration.
      MYSQL_PASSWORD: !reset null
      OMEKA_SECRET_KEY: !reset null
      TYPESENSE_API_KEY: !reset null
      OMEKA_ADMIN_PASSWORD: !reset null
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      OMEKA_SECRET_KEY_FILE: /run/secrets/omeka_secret_key
      TYPESENSE_API_KEY_FILE: /run/secrets/typesense_api_key
      OMEKA_ADMIN_PASSWORD_FILE: /run/secrets/omeka_admin_password
      # Names (never values) of the four variables still set in .env or the
      # shell. The entrypoint refuses to start while this is non-empty: the
      # reset above would otherwise drop such a value without a word, and the
      # point of this overlay is that .env no longer holds them.
      OMEKA_SECRETS_ALSO_IN_ENV: "${MYSQL_PASSWORD:+MYSQL_PASSWORD }${OMEKA_SECRET_KEY:+OMEKA_SECRET_KEY }${TYPESENSE_API_KEY:+TYPESENSE_API_KEY }${OMEKA_ADMIN_PASSWORD:+OMEKA_ADMIN_PASSWORD}"
    secrets:
      - mysql_password
      - omeka_secret_key
      - typesense_api_key
      - omeka_admin_password

  db:
    environment:
      MYSQL_PASSWORD: !reset null
      # Read natively by the official image's entrypoint (file_env), and by
      # the base healthcheck and the backup/restore helpers.
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_password

  typesense:
    environment:
      TYPESENSE_API_KEY: !reset null
      # Read by _docker/typesense/entrypoint.sh, which exports the key and
      # unsets this variable before starting the server (Typesense would
      # otherwise treat any TYPESENSE_* variable as an option).
      TYPESENSE_API_KEY_FILE: /run/secrets/typesense_api_key
    secrets:
      - typesense_api_key

secrets:
  mysql_password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env (for example ./secrets) when using compose.secrets.yml}/mysql_password
  omeka_secret_key:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env (for example ./secrets) when using compose.secrets.yml}/omeka_secret_key
  typesense_api_key:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env (for example ./secrets) when using compose.secrets.yml}/typesense_api_key
  omeka_admin_password:
    file: ${SECRETS_DIR:?Set SECRETS_DIR in .env (for example ./secrets) when using compose.secrets.yml}/omeka_admin_password
