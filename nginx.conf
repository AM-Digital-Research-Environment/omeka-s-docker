server {
    listen 80;
    # SERVER_NAME is substituted from the .env file by the nginx image's
    # /etc/nginx/templates/ envsubst step (see docker-compose.yml).
    # Defaults to "_" (catch-all) if SERVER_NAME is unset.
    server_name ${SERVER_NAME};

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    root /var/www/html;
    index index.php;

    client_max_body_size 100M;

    # File descriptor caching for frequently accessed files
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security headers (server level - inherited by locations without add_header)
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    # Allow embedding as an iframe only by the trusted domains below (plus self).
    # frame-ancestors is the modern replacement for X-Frame-Options and, unlike
    # it, supports a list of origins. We drop X-Frame-Options entirely because
    # sending both can make stricter browsers fall back to its single-origin rule
    # and block the allowed embeds.
    add_header Content-Security-Policy "frame-ancestors 'self' https://www.frederickmadore.com https://slides.frederickmadore.com" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), midi=(), camera=()" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Block external access to PHP-FPM status page (internal healthcheck only)
    location = /status {
        deny all;
        return 404;
    }

    # Serve .mjs files with correct MIME type (required by Mirador 4)
    location ~* \.mjs$ {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|eot|svg|webp|avif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Admin login - strict rate limiting for brute-force protection
    location = /admin/login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # AMIRA MCP server (Streamable-HTTP/SSE). `^~` makes this prefix win over
    # `location /` and short-circuits the regex blocks, so the request never
    # reaches Omeka's index.php router (no URL appropriation / 404 / redirect).
    #
    # The upstream is resolved at request time (not at config load) via Docker's
    # embedded DNS, by putting the hostname in a variable. This way a missing or
    # stopped amira-mcp container returns 502 for /mcp only, instead of making
    # nginx fail to boot and taking the whole site down. `valid=10s` re-resolves
    # so /mcp recovers on its own once amira-mcp comes back. NGINX_ENVSUBST_FILTER
    # (see docker-compose.yml) keeps these $variables safe from envsubst.
    location ^~ /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $amira_mcp amira-mcp;
        proxy_pass http://$amira_mcp:8787$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";   # keepalive / SSE
        proxy_buffering off;                      # critical for SSE streaming
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }
}
