server {
    listen 80;
    # SERVER_NAME is substituted from the .env file by the nginx image's
    # /etc/nginx/templates/ envsubst step (see docker-compose.yml).
    # Defaults to "_" (catch-all) if SERVER_NAME is unset.
    server_name ${SERVER_NAME};

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    root /var/www/html;
    index index.php;

    client_max_body_size 100M;

    # File descriptor caching for frequently accessed files
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security headers (server level - inherited by locations without add_header)
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    # Allow embedding as an iframe only by the origins in FRAME_ANCESTORS
    # (substituted from .env via docker-compose.yml; defaults to 'self').
    # frame-ancestors is the modern replacement for X-Frame-Options and, unlike
    # it, supports a list of origins. We drop X-Frame-Options entirely because
    # sending both can make stricter browsers fall back to its single-origin rule
    # and block the allowed embeds.
    add_header Content-Security-Policy "frame-ancestors ${FRAME_ANCESTORS}" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), midi=(), camera=()" always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Block external access to PHP-FPM status page (internal healthcheck only)
    location = /status {
        deny all;
        return 404;
    }

    # --- Deny access to Omeka's private files and source ---------------------
    # These blocks MUST come before the static-file and PHP location blocks:
    # nginx evaluates regex locations top-to-bottom and the first match wins.
    # Without them, `location /` below happily serves any existing file
    # (config/database.ini, composer.json, logs, source) as plain text.

    # Private data, config, logs, source, dependency and ingest directories.
    location ~ ^/(?:config|data|logs|vendor|node_modules|sideload|build|install)(?:/|$) {
        return 404;
    }

    # Omeka's PHP source under application/, except its public asset/ subtree
    # (CSS/JS/images the browser must still load from /application/asset/...).
    location ~ ^/application/(?!asset/) {
        return 404;
    }

    # Same rule for modules and themes, which ship their entire source tree into
    # the document root. The deny lists above are anchored at the document root,
    # so without this a module's composer.json, package-lock.json or
    # vendor/composer/installed.json is served verbatim — a precise inventory of
    # dependency versions to match against known CVEs — along with its src/,
    # tests/ and CI configuration.
    #
    # Allow-list rather than deny-list: everything the browser legitimately
    # loads from a module or theme lives under asset/, so listing the private
    # parts would mean chasing every new dependency manager and test runner.
    # Note this must not become a blanket "no JSON here" rule: asset/ JSON is
    # real content (DreVisualizations serves its precomputed dashboards from
    # asset/data/).
    #
    # theme.jpg is the one documented exception: Omeka's own Theme::getThumbnail
    # points the admin theme picker at /themes/<id>/theme.jpg.
    location ~ ^/(?:modules|themes)/[^/]+/(?!asset/|theme\.jpg$) {
        return 404;
    }

    # Sensitive top-level files (module/theme asset/ dirs are unaffected).
    location ~ ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|README\.md|LICENSE|bootstrap\.php|cli-config\.php|\.?env.*)$ {
        return 404;
    }

    # Never serve config/dump/script files as static content, wherever they sit.
    location ~* \.(?:ini|ya?ml|sql|sh|bak|dist|lock|log)$ {
        return 404;
    }

    # Serve .mjs files with correct MIME type (required by Mirador 4)
    location ~* \.mjs$ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri =404;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|eot|svg|webp|avif)$ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Admin login - strict rate limiting for brute-force protection
    location = /admin/login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Extension point for deployment overlays: extra location blocks mounted
    # into /etc/nginx/templates/extra-locations/ are rendered by the nginx
    # image's envsubst step into /etc/nginx/conf.d/extra-locations/ and picked
    # up here (e.g. compose.amira.yml adds a /mcp location). A glob include
    # that matches nothing is a no-op, so the base stack needs no such
    # directory.
    include /etc/nginx/conf.d/extra-locations/*.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Omeka S is a single-front-controller app: every dynamic request is
    # rewritten to /index.php by the `location /` block above. Executing only
    # index.php means a stray or malicious .php anywhere under the docroot
    # (modules, application source, an uploaded file) can never be run.
    location = /index.php {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

    # Refuse any other PHP file instead of forwarding it to PHP-FPM.
    location ~ \.php$ {
        return 404;
    }
}
