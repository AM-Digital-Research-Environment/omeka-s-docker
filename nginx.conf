server {
    listen 80;
    # SERVER_NAME is substituted from the .env file by the nginx image's
    # /etc/nginx/templates/ envsubst step (see docker-compose.yml).
    # Defaults to "_" (catch-all) if SERVER_NAME is unset.
    server_name ${SERVER_NAME};

    # Log in the "redacted" format (nginx-http-settings.conf): the image's
    # default "main" format with Omeka API keys removed from the request line
    # and the referer. Declared here, at server level, because it then replaces
    # the image's http-level `access_log ... main` instead of logging each
    # request a second time, unredacted. A location that sets its own
    # access_log must use this format too.
    access_log /var/log/nginx/access.log redacted;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1000;
    gzip_types
        application/javascript
        application/json
        application/ld+json
        application/n-quads
        application/n-triples
        application/rdf+xml
        application/sparql-results+json
        application/sparql-results+xml
        application/trig
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/csv
        text/javascript
        text/plain
        text/tab-separated-values
        text/turtle
        text/xml;

    root /var/www/html;
    index index.php;

    client_max_body_size 100M;

    # File descriptor caching for frequently accessed files
    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security headers (server level - inherited by locations without add_header)
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    # Allow embedding as an iframe only by the origins in FRAME_ANCESTORS
    # (substituted from .env via docker-compose.yml; defaults to 'self').
    # frame-ancestors is the modern replacement for X-Frame-Options and, unlike
    # it, supports a list of origins. We drop X-Frame-Options entirely because
    # sending both can make stricter browsers fall back to its single-origin rule
    # and block the allowed embeds.
    add_header Content-Security-Policy "frame-ancestors ${FRAME_ANCESTORS}" always;
    # "0" disables the legacy XSS auditor: the header is deprecated, current
    # browsers ignore it, and in old ones "1; mode=block" could itself be abused
    # to blank or probe pages (MDN and OWASP both recommend 0).
    add_header X-XSS-Protection "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), midi=(), camera=()" always;
    # Empty, so absent, unless NGINX_HSTS_MAX_AGE > 0 and the request came in
    # over HTTPS (map in nginx-http-settings.conf). Kept in the security-headers
    # snippet too, so locations with their own add_header send it as well.
    add_header Strict-Transport-Security $strict_transport_security always;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Block external access to PHP-FPM status page (internal healthcheck only)
    location = /status {
        deny all;
        return 404;
    }

    # --- Deny access to Omeka's private files and source ---------------------
    # These blocks MUST come before the static-file and PHP location blocks:
    # nginx evaluates regex locations top-to-bottom and the first match wins.
    # Without them, `location /` below happily serves any existing file
    # (config/database.ini, composer.json, logs, source) as plain text.

    # Private data, config, logs, source, dependency and ingest directories.
    location ~ ^/(?:config|data|logs|vendor|node_modules|sideload|build|install)(?:/|$) {
        return 404;
    }

    # Module working directories inside the media volume that were never meant
    # to be downloaded. EasyAdmin keeps module/theme backups (zip archives of
    # source) in files/backup, staged uploads in files/import and its checks in
    # files/check; IiifServer caches manifests in files/iiif, private items
    # included, and serves them through Omeka. Each ships an Apache .htaccess
    # ("Require all denied") which says nginx must deny the directory in its
    # own configuration, so this is that rule.
    location ~ ^/files/(?:backup|import|check|iiif)(?:/|$) {
        return 404;
    }

    # Omeka's PHP source under application/, except its public asset/ subtree
    # (CSS/JS/images the browser must still load from /application/asset/...).
    location ~ ^/application/(?!asset/) {
        return 404;
    }

    # Same rule for modules and themes, which ship their entire source tree into
    # the document root. The deny lists above are anchored at the document root,
    # so without this a module's composer.json, package-lock.json or
    # vendor/composer/installed.json is served verbatim — a precise inventory of
    # dependency versions to match against known CVEs — along with its src/,
    # tests/ and CI configuration.
    #
    # Allow-list rather than deny-list: everything the browser legitimately
    # loads from a module or theme lives under asset/, so listing the private
    # parts would mean chasing every new dependency manager and test runner.
    # Note this must not become a blanket "no JSON here" rule: asset/ JSON is
    # real content (DreVisualizations serves its precomputed dashboards from
    # asset/data/).
    #
    # theme.jpg is the one documented exception: Omeka's own Theme::getThumbnail
    # points the admin theme picker at /themes/<id>/theme.jpg.
    location ~ ^/(?:modules|themes)/[^/]+/(?!asset/|theme\.jpg$) {
        return 404;
    }

    # Sensitive top-level files (module/theme asset/ dirs are unaffected).
    location ~ ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|README\.md|LICENSE|bootstrap\.php|cli-config\.php|\.?env.*)$ {
        return 404;
    }

    # Never serve config/dump/script files as static content, wherever they sit.
    location ~* \.(?:ini|ya?ml|sql|sh|bak|dist|lock|log)$ {
        return 404;
    }

    # Only the exact /index.php location below may execute PHP. Reject source
    # variants and PATH_INFO before the static regex (e.g. upload.php/photo.jpg).
    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) {
        return 404;
    }

    # Uploaded media and module output (the omeka_media volume). A regex
    # location rather than `^~ /files/`, on purpose: placed after the deny
    # rules above, it still lets them win (dot-files, PHP, .sql/.log/... under
    # /files/ stay refused), while it comes before the static-file regexes
    # below so every type under /files/ gets the policy here.
    location ~ ^/files/ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        # Long-lived only for Omeka's own media directories; see the map in
        # nginx-http-settings.conf for the allow-list and why.
        add_header Cache-Control $files_cache_control;
        # Sandbox CSP for HTML/SVG/XML documents only (empty, so absent, for
        # images, audio, video, PDF...); see the map for the type list.
        add_header Content-Security-Policy $files_active_content_csp always;
        # Missing files still go to Omeka's router, as with `location /`.
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Omeka's REST API: /api, /api/<resource>[/<id>], and /api-local, the same
    # API without key authentication that the admin UI calls with its session
    # (resource template and owner pickers, page block forms). /api-local is
    # limited too, deliberately: it answers anonymous visitors with the same
    # public data as /api, so leaving it out would only move a scraper one path
    # over. The admin UI makes a handful of these calls per form, far inside
    # the burst. /api-context (one small, constant JSON-LD document) is left
    # alone.
    #
    # The limit is a no-op unless NGINX_API_RATE_LIMIT=on (the zone's key is
    # empty otherwise; see nginx-http-settings.conf, which also warns about
    # in-stack API clients). burst=20 nodelay serves a short burst at once,
    # then holds each client to NGINX_API_RATE; excess requests get 429.
    #
    # A regex location placed here, after the deny rules above, so dot-files,
    # PHP and config extensions under /api stay refused exactly as before, and
    # before the static-file regexes below, so a URL such as /api/items/1.css
    # (Omeka reads the id as 1) cannot sidestep the limit. Nothing under /api
    # exists on disk, so those static locations only ever forwarded such
    # requests to index.php anyway (the .mjs one answered 404 itself; Omeka now
    # answers its own 404); that, with the same try_files and the server-level
    # headers (no add_header here), is what this location does.
    location ~ ^/api(?:-local)?(?:/|$) {
        limit_req zone=api burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve .mjs files with correct MIME type (required by Mirador 4)
    location ~* \.mjs$ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        default_type application/javascript;
        # Same policy as the static files below.
        add_header Cache-Control $static_cache_control;
        try_files $uri =404;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|eot|svg|webp|avif)$ {
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        # Long-lived when the URL carries Omeka's ?v=<version> cache-buster,
        # revalidated on every view otherwise: stable URLs change content
        # after an admin updates an extension. See the map in
        # nginx-http-settings.conf for the lifetimes and why. Conditional
        # requests still use nginx's ETag / Last-Modified validators.
        add_header Cache-Control $static_cache_control;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Admin login - strict rate limiting for brute-force protection
    location = /admin/login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Extension point for deployment overlays: extra location blocks mounted
    # into /etc/nginx/templates/extra-locations/ are rendered by the nginx
    # image's envsubst step into /etc/nginx/conf.d/extra-locations/ and picked
    # up here (e.g. compose.amira.yml adds a /mcp location). A glob include
    # that matches nothing is a no-op, so the base stack needs no such
    # directory.
    include /etc/nginx/conf.d/extra-locations/*.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Omeka S is a single-front-controller app: every dynamic request is
    # rewritten to /index.php by the `location /` block above. Executing only
    # index.php means a stray or malicious .php anywhere under the docroot
    # (modules, application source, an uploaded file) can never be run.
    location = /index.php {
        # Resolve the php upstream per request, not once at config load. With a
        # literal `fastcgi_pass php:9000` nginx caches the container IP for the
        # life of the worker, so recreating php alone (docker compose up -d php)
        # leaves nginx talking to an address nobody answers on and the whole
        # site returns 502 until web is restarted too. Putting the host in a
        # variable forces a fresh lookup against Docker's embedded DNS, cached
        # for valid=10s — the same technique the /mcp location uses.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream php;
        fastcgi_pass $php_upstream:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_hide_header X-Powered-By;
    }

}
