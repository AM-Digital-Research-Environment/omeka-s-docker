# Security headers snippet - include in location blocks that use add_header
# (nginx clears parent add_header directives when a child block defines its own)
#
# Mounted as an envsubst template (docker-compose.yml) and rendered to
# /etc/nginx/conf.d/snippets/security-headers.conf so FRAME_ANCESTORS from
# .env applies here too. The snippets/ subdirectory keeps it out of the
# http-level `include conf.d/*.conf` glob (which is not recursive).

# See nginx.conf for why frame-ancestors replaces X-Frame-Options (kept in sync).
add_header Content-Security-Policy "frame-ancestors ${FRAME_ANCESTORS}" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), midi=(), camera=()" always;
