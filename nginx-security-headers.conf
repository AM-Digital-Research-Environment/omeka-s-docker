# Security headers snippet - include in location blocks that use add_header
# (nginx clears parent add_header directives when a child block defines its own)

# See nginx.conf for why frame-ancestors replaces X-Frame-Options (kept in sync).
add_header Content-Security-Policy "frame-ancestors 'self' https://www.frederickmadore.com https://slides.frederickmadore.com" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), midi=(), camera=()" always;
